# Full stack: `docker compose up --build` → http://localhost:8080
name: lazyagents

x-api-env: &api-env
  DATABASE_URL: postgres://lazyagents:${POSTGRES_PASSWORD:-lazyagents}@postgres:5432/lazyagents?sslmode=disable
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lazyagents}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-lazyagents-secret}
  SECRETS_KEY: ${SECRETS_KEY:-}
  # The API calls the web app's design worker (/internal/designs) with this bearer token.
  # Set your own in .env; the default is for a local, unpublished stack only.
  DESIGN_WORKER_TOKEN: ${DESIGN_WORKER_TOKEN:-vesper-local-design-worker}
  DESIGN_WORKER_URL: http://web:3000/internal/designs
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  SEED: ${SEED:-false}
  LOCAL_USER_NAME: ${LOCAL_USER_NAME:-Local user}
  LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-me@localhost}
  ROLLOVER_CONTEXT_TOKENS: ${ROLLOVER_CONTEXT_TOKENS:-0}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lazyagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazyagents}
      POSTGRES_DB: lazyagents
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazyagents -d lazyagents"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    # Each bucket grows 7 volumes up front. The defaults (30 GB volumes, a low
    # volume cap) run out after one bucket, so use 1 GB volumes and allow 100.
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=100 -ip=seaweedfs -ip.bind=0.0.0.0
    volumes:
      - seaweed:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./server
    environment: *api-env
    # The only service on the agents network, so turn containers reach it as
    # api:8000 and nothing else in the stack.
    networks: [default, agents]
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "vesper", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The image managed runs execute in. Built here; it runs once and exits.
  agent-base:
    build:
      context: ./deploy/agent-base
    image: vesper/agent-base:latest
    command: ["true"]

  # Executes dispatched runs (docs/dev/plan.md §6.4–6.6). It drives Docker through the
  # socket, which is root-equivalent on the host: fine for a laptop (v1),
  # documented in README. Turn containers join the agents network and reach
  # the API as api:8000; Postgres and SeaweedFS aren't on it, so a shell in a
  # turn can't connect to them with the stack's default credentials.
  runner:
    build:
      context: ./server
    command: ["runner"]
    user: "0"
    environment:
      <<: *api-env
      RUNNER_BACKEND: docker
      RUNNER_IMAGE: ${RUNNER_IMAGE:-vesper/agent-base:latest}
      RUNNER_NETWORK: lazyagents_agents
      RUNNER_MCP_URL: http://api:8000/mcp
      # Its containers are this stack's alone: cleanup never touches the dev stack's.
      RUNNER_STACK: lazyagents
      RUNNER_MAX_CONCURRENT: ${RUNNER_MAX_CONCURRENT:-2}
      RUNNER_REPO_MAP: ${RUNNER_REPO_MAP:-false}
      RUNNER_CHAT_IDLE_TTL_S: ${RUNNER_CHAT_IDLE_TTL_S:-14400}
      RUNNER_MAX_HOLD_S: ${RUNNER_MAX_HOLD_S:-86400}
      RUNNER_MAX_HOLD_ATTEMPTS: ${RUNNER_MAX_HOLD_ATTEMPTS:-12}
      # Each turn's sandboxed Docker API socket; turns mount the volume read-only.
      RUNNER_DOCKER_PROXY_DIR: /run/lazyagents-docker
      RUNNER_DOCKER_PROXY_VOLUME: lazyagents-docker-proxy
      # The volume (created on first use) holding the Nix store turns share
      # through this runner's nix-daemon. One daemon per store: the stacks
      # must not share it.
      RUNNER_NIX_VOLUME: lazyagents-nix
      # Chats' playgrounds, one per port, on Vesper's host. The browser sends
      # them the Vesper session (same host), which is how the runner admits it.
      RUNNER_PLAYGROUND_PORTS: ${PLAYGROUND_PORTS:-8090-8094}
    ports:
      - "127.0.0.1:${PLAYGROUND_PORTS:-8090-8094}:${PLAYGROUND_PORTS:-8090-8094}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-proxy:/run/lazyagents-docker
    depends_on:
      api: { condition: service_healthy }
      agent-base: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
      DESIGN_WORKER_TOKEN: ${DESIGN_WORKER_TOKEN:-vesper-local-design-worker}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    ports:
      # Loopback only by default: until the first browser sets a password,
      # whoever reaches the port can claim the install. LAZYAGENTS_BIND=0.0.0.0
      # opens it to the network.
      - "${LAZYAGENTS_BIND:-127.0.0.1}:${LAZYAGENTS_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - api
      - web

networks:
  agents:
    # Fixed name: the runner passes it to Docker as RUNNER_NETWORK.
    name: lazyagents_agents

volumes:
  pgdata:
  seaweed:
  caddy:
  docker-proxy:
    # Fixed name: the runner mounts it into turns as RUNNER_DOCKER_PROXY_VOLUME.
    name: lazyagents-docker-proxy
