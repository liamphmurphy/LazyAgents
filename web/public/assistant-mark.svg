<svg xmlns="http://www.w3.org/2000/svg" width="92" height="92" viewBox="0 0 92 92" fill="none">
  <title>Assistant</title>
  <defs>
    <!-- Dusk deep → violet (tokens.css --brand-deep, --brand-violet). -->
    <linearGradient id="am-sky" x1="46" y1="0" x2="46" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B2366"/>
      <stop offset="1" stop-color="#7864D9"/>
    </linearGradient>
    <linearGradient id="am-hat" x1="40" y1="5" x2="52" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#231D52"/>
      <stop offset="1" stop-color="#14122A"/>
    </linearGradient>
    <radialGradient id="am-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(46 50) scale(30)">
      <stop stop-color="#FFF6DD" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFF6DD" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="92" height="92" fill="url(#am-sky)"/>
  <circle cx="46" cy="50" r="30" fill="url(#am-glow)"/>
  <circle cx="18" cy="20" r="1.3" fill="#F7F5FF" fill-opacity=".7"/>
  <circle cx="77" cy="29" r="1.1" fill="#F7F5FF" fill-opacity=".6"/>
  <circle cx="72" cy="12" r="1.5" fill="#FFF6DD" fill-opacity=".85"/>
  <circle cx="13" cy="44" r=".9" fill="#F7F5FF" fill-opacity=".5"/>
  <!-- Robe, with a peach collar. -->
  <path d="M8 92c3-17 15-24 38-24s35 7 38 24Z" fill="#1C1745"/>
  <path d="M30 74.5 46 92l16-17.5" stroke="#F2A97E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Face, beard and moustache. -->
  <ellipse cx="46" cy="47" rx="13" ry="14" fill="#F3D9C6"/>
  <path d="M33 50c0 15 6 27 13 33 7-6 13-18 13-33-3 4-8 6-13 6s-10-2-13-6Z" fill="#F4F1FF"/>
  <path d="M40 66c2 4 4 7 6 9m6-9c-2 4-4 7-6 9" stroke="#D9D3F2" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M37 54c3-3 6-3 9-1 3-2 6-2 9 1-3 3-6 3-9 1-3 2-6 2-9-1Z" fill="#D9D3F2"/>
  <circle cx="41" cy="46" r="1.7" fill="#1C1745"/>
  <circle cx="51" cy="46" r="1.7" fill="#1C1745"/>
  <path d="m37.5 42.5 6-1m5 0 6 1" stroke="#F4F1FF" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Pointed hat with a peach band and a star. -->
  <path d="M28 37 49 5c1 6-1 11 5 15l11 17Z" fill="url(#am-hat)"/>
  <path d="M29.5 34.5h34l1.6 2.5H28Z" fill="#F2A97E"/>
  <ellipse cx="46" cy="37.5" rx="23" ry="4.2" fill="#14122A"/>
  <path d="M48 18c.5 3.5 1.3 4.3 4.8 4.8-3.5.5-4.3 1.3-4.8 4.8-.5-3.5-1.3-4.3-4.8-4.8 3.5-.5 4.3-1.3 4.8-4.8Z" fill="#FFF6DD"/>
  <circle cx="40" cy="29" r="1" fill="#F2A97E"/>
</svg>
