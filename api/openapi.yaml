        has_override: { type: boolean }
        resolved: { $ref: "#/components/schemas/ResolvedDefinition" }
        base_branch: { type: string }
        repo_url: { type: string }
        branch: { type: string }
        setup: { type: array, items: { type: string } }
        context: { type: array, items: { $ref: "#/components/schemas/DispatchContext" } }
        scopes: { type: array, items: { $ref: "#/components/schemas/DispatchScope" } }
        secrets: { type: array, items: { $ref: "#/components/schemas/DispatchSecret" } }
