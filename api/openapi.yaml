      type: object
      properties:
        body_md: { type: string }
        path: { type: string, description: Move the page here; the old path keeps resolving }
        base_version_id:
          type: string
          format: uuid
          description: The version the editor started from; a save over a newer version is refused (409)
        note: { type: string }
    WikiSuggestion:
      type: object
      required: [id, artifact_id, path, title, body_md, current_body_md, author, created_at, stale, new_page]
