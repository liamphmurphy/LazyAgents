openapi: 3.0.3
info:
  title: LazyAgents API
  version: 0.2.0
  description: |
    REST contract for the LazyAgents UI and agents. This file is the source of
    truth: `make gen` regenerates the Go server interfaces and the TypeScript client.

    There is no login for now: every request acts as the workspace's local
    user (its first user). Errors share the `Error` shape: 404 not found,
    422 validation (with `field` set when one input is at fault).

    Realtime: `GET /events` (outside /api/v1) is an SSE stream of
    invalidation hints `{"type": "...", "ids": [...]}`; clients refetch.
    Types include `ticket.updated` (ids: the changed ticket ids),
    `epic.updated` (ids: the changed epic ids, sent when an epic, its
    criteria or its tickets' status/estimate change), `activity.created`,
    `approval.created`, `run.updated`, and `chat.updated` (ids: the chat id)
    when a chat's messages, state, title, archive flag or harness/model change.

    Board, estimates and epic criteria: see the wiki page
    `Architecture/ADR - Kanban board, estimates and epic criteria`.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: workspace
  - name: tickets
  - name: artifacts
  - name: agents
  - name: secrets
  - name: runs
  - name: chats
  - name: memories
paths:
  /agents/{handle}/runs:
    get:
      operationId: listAgentRuns
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: Run history, newest first, 50 per page
          content:
            application/json:
              schema:
                type: object
                required: [runs, has_more]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/AgentRunSummary" } }
                  has_more: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /dashboard:
    get:
      operationId: getDashboard
      summary: Live Dashboard data and recorded performance statistics
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [24h, 7d, 30d], default: 7d } }
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        default: { $ref: "#/components/responses/Error" }
  /epics:
    get:
      operationId: listEpicOverviews
      summary: Live EpicOverviewList data and recorded performance statistics
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpicOverviewList" }
        default: { $ref: "#/components/responses/Error" }
  /epics/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateEpic
      summary: Change an epic. Omitted fields are untouched.
      description: |
        Setting `status: done` is gated: every acceptance criterion must be
        checked and every ticket in the epic must be `done` or `canceled`.
        Otherwise 409, with a message naming the open tickets and the
        unchecked criterion positions. Moving back to `open` is always allowed.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requires_mockup:
                  type: boolean
                  description: Every ticket in the epic needs a person-approved UI mockup before it can be finished
                status: { $ref: "#/components/schemas/EpicStatus" }
      responses:
        "200":
          description: The updated epic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Epic" }
        default: { $ref: "#/components/responses/Error" }
  /epics/{id}/review:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createEpicReview
      summary: Add the epic's final review ticket now
      description: |
        The server creates an epic's final review ticket automatically once its
        last regular ticket finishes (in review, done or canceled). This adds it
        early so it can be dispatched at the end: until the epic's other tickets
        finish, dispatching it is refused. Idempotent: returns the existing
        review ticket if there is one. 409 when the epic is done or its project
        is archived.
      tags: [tickets]
      responses:
        "200":
          description: The epic's final review ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkTicket" }
        default: { $ref: "#/components/responses/Error" }
  /epics/{id}/criteria:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listEpicCriteria
      summary: The epic's final acceptance criteria, in order
      tags: [tickets]
      responses:
        "200":
          description: Criteria
          content:
            application/json:
              schema:
                type: object
                required: [criteria]
                properties:
                  criteria: { type: array, items: { $ref: "#/components/schemas/EpicCriterion" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createEpicCriterion
      summary: Append an acceptance criterion to an epic (409 when the epic is done)
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpicCriterion" }
        default: { $ref: "#/components/responses/Error" }
  /epic-criteria/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateEpicCriterion
      summary: Edit or tick an epic acceptance criterion
      description: Unticking or editing a criterion of a done epic is 409 (reopen the epic first).
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                done: { type: boolean }
                position: { type: integer, minimum: 1, description: "Move to this 1-based position; other criteria shift to keep positions contiguous." }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpicCriterion" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEpicCriterion
      summary: Remove an epic acceptance criterion (later positions move up; 409 when the epic is done)
      tags: [tickets]
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Error" }
  /agent-overviews:
    get:
      operationId: listAgentOverviews
      summary: Live AgentOverviewList data and recorded performance statistics
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentOverviewList" }
        default: { $ref: "#/components/responses/Error" }
  /delegation-efficiency:
    get:
      operationId: listDelegationEfficiency
      summary: What delegating to each sub agent costs, and how often its first attempt passes the runner's checks
      responses:
        "200":
          description: Per sub agent efficiency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelegationEfficiencyList" }
        default: { $ref: "#/components/responses/Error" }
  /inbox:
    get:
      operationId: listInbox
      summary: Attention items for the local user, including resolved history
      parameters:
        - { name: project, in: query, schema: { type: string } }
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
        default: { $ref: "#/components/responses/Error" }
  /inbox/read:
    post:
      operationId: readInboxItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "204": { description: Marked read }
        default: { $ref: "#/components/responses/Error" }
  /search:
    get:
      operationId: search
      summary: Search tickets, artifacts, wiki pages, epics, agents and the local user's chats
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 500 } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        default: { $ref: "#/components/responses/Error" }
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency status
      tags: [system]
      responses:
        "200":
          description: All dependencies reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: One or more dependencies are unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /bootstrap:
    get:
      operationId: getBootstrap
      summary: Everything the shell and pickers need in one call (`me` is the local user)
      tags: [workspace]
      responses:
        "200":
          description: Workspace context for the signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        default: { $ref: "#/components/responses/Error" }

  /tickets:
    get:
      operationId: listTickets
      summary: List tickets for a view, with optional filters
      tags: [tickets]
      parameters:
        - name: project
          in: query
          description: Project key, e.g. PAY
          schema: { type: string }
        - name: view
          in: query
          schema:
            type: string
            enum: [active, backlog, agent_owned, needs_human, all]
            default: active
        - name: status
          in: query
          description: Restrict to one status (applied within the view)
          schema: { $ref: "#/components/schemas/TicketStatus" }
        - { name: ready, in: query, description: Assigned tickets ready for manual dispatch, schema: { type: boolean } }
        - name: assignee
          in: query
          description: Agent handle
          schema: { type: string }
        - name: label
          in: query
          description: Label id
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Free-text search over key, title and description
          schema: { type: string }
        - { name: epic, in: query, description: Epic id, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Matching tickets, ordered by status then priority
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createTicket
      summary: Create a ticket
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTicket" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/bulk:
    post:
      operationId: bulkUpdateTickets
      summary: Apply one patch to many tickets
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: getTicket
      summary: A ticket with its criteria
      tags: [tickets]
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTicket
      summary: Change ticket fields. Omitted fields are untouched; null clears.
      description: |
        Revision-checked: when `revision` is sent it must equal the ticket's
        current `revision`, otherwise 409 (`conflict`) and nothing changes;
        refetch and retry. The board and the edit modal always send it;
        callers that omit it get last-write-wins. Every applied change bumps
        `revision` by one (including runner, agent and PR-sync changes);
        criteria edits through `/criteria` don't.
        422 (`invalid`, with `field`) on an unknown status or priority, an
        `estimate_points` value outside the scale, or an epic from another
        project. Setting `canceled` while the ticket has a live run is 409.
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPatch" }
      responses:
        "200":
          description: The updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/activity:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: listTicketActivity
      summary: The ticket timeline, oldest first
      tags: [tickets]
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityEvent" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/comments:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    post:
      operationId: createComment
      summary: Comment on a ticket (appears in the timeline)
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewComment" }
      responses:
        "201":
          description: The timeline event for the comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityEvent" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/criteria:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    post:
      operationId: createCriterion
      summary: Add an acceptance criterion
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Criterion" }
        default: { $ref: "#/components/responses/Error" }

  /criteria/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateCriterion
      summary: Edit or tick an acceptance criterion
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                done: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Criterion" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCriterion
      summary: Remove an acceptance criterion
      tags: [tickets]
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/artifacts:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    post:
      operationId: attachArtifact
      summary: Attach an artifact to a ticket as context (or as generated output)
      tags: [tickets, artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact_id]
              properties:
                artifact_id: { type: string, format: uuid }
                relation: { $ref: "#/components/schemas/ArtifactRelation" }
      responses:
        "200":
          description: The ticket with its artifacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: detachArtifact
      summary: Remove an artifact from a ticket
      tags: [tickets, artifacts]
      responses:
        "200":
          description: The ticket with its artifacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts:
    get:
      operationId: listArtifacts
      summary: Artifacts, newest first, with per-type counts for the tabs
      tags: [artifacts]
      parameters:
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/ArtifactType" }
        - name: project
          in: query
          description: Project key
          schema: { type: string }
        - name: q
          in: query
          description: Full-text search over titles, summaries and contents
          schema: { type: string }
      responses:
        "200":
          description: Matching artifacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createArtifact
      summary: Create an artifact from markdown (body_md) or an uploaded file
      description: |
        Send exactly one of `body_md` or `file`. Markdown files (.md, text/markdown)
        are stored as text so they can be outlined and searched; anything else is
        stored in object storage. The title defaults to the first heading, then
        the filename.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/NewArtifact" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: getArtifact
      summary: An artifact with its current version, outline, readers, history and tickets
      tags: [artifacts]
      responses:
        "200":
          description: The artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateArtifact
      summary: Edit title, summary or epic (contents change via new versions)
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 300 }
                summary: { type: string, maxLength: 2000 }
                epic_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      operationId: createArtifactVersion
      summary: Add a version (markdown, SVG source in body_md for mockups, or file); it becomes current
      tags: [artifacts]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/NewArtifactVersion" }
      responses:
        "201":
          description: The artifact at its new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts/{id}/versions/{versionId}/review:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewArtifactVersion
      summary: Approve a mockup version or request changes. Only the current version can be reviewed; waiting agent runs resume with the decision.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, changes_requested] }
                note: { type: string, maxLength: 2000, description: Required when requesting changes }
                pins:
                  type: array
                  maxItems: 50
                  description: Comments pinned on the drawing. They're saved with the review and appended to its note as a numbered list.
                  items: { $ref: "#/components/schemas/MockupPin" }
      responses:
        "200":
          description: The reviewed mockup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /artifacts/{id}/versions/{versionId}/content:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: download
        in: query
        description: Send Content-Disposition attachment instead of inline
        schema: { type: boolean }
    get:
      operationId: getArtifactContent
      summary: The raw content of one version (markdown text, mockup SVG as image/svg+xml, or the stored file)
      tags: [artifacts]
      responses:
        "200":
          description: Raw bytes
          content:
            "*/*":
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /agents:
    post:
      operationId: createAgent
      summary: Create an agent with a default definition
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, name]
              properties:
                handle: { type: string }
                name: { type: string }
                role: { type: string }
                specialty: { type: string }
                color_index: { type: integer }
                kind: { $ref: "#/components/schemas/AgentKind" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
    get:
      operationId: getAgent
      summary: An agent with its current definition, history and project overrides
      tags: [agents]
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgent
      summary: Delete an agent (archived, so run history stays); 409 while it has open tickets or runs in progress
      tags: [agents]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/definition:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
    put:
      operationId: saveAgentDefinition
      summary: Save a new immutable definition version (runs in progress keep their snapshot)
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role, specialty, color_index, spec]
              properties:
                name: { type: string }
                role: { type: string }
                specialty: { type: string }
                color_index: { type: integer }
                kind: { $ref: "#/components/schemas/AgentKind", description: "Omit to keep the current kind. A sub agent can't have open tickets assigned." }
                spec: { $ref: "#/components/schemas/AgentSpec" }
                note: { type: string, description: "What changed, for the version list" }
      responses:
        "200":
          description: The agent at its new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/overrides/{project}:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
      - name: project
        in: path
        required: true
        description: Project key
        schema: { type: string }
    put:
      operationId: setAgentOverride
      summary: Set a project's override. An empty override removes it. Scopes can only tighten.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentOverride" }
      responses:
        "200":
          description: The agent with its overrides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/resolved:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
      - name: project
        in: query
        description: Project key; omit for the bare definition
        schema: { type: string }
    get:
      operationId: getResolvedDefinition
      summary: The definition merged with a project's override, as a run would snapshot it
      tags: [agents]
      responses:
        "200":
          description: Resolved definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedDefinition" }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/tokens:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
    get:
      operationId: listAgentTokens
      summary: Tokens for unmanaged sessions (bring your own agent)
      tags: [agents]
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema:
                type: object
                required: [tokens, mcp_url]
                properties:
                  tokens: { type: array, items: { $ref: "#/components/schemas/AgentToken" } }
                  mcp_url: { type: string, description: Where agents connect }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentToken
      summary: Mint a token. The plaintext is returned once and never stored.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [token, info, mcp_url]
                properties:
                  token: { type: string }
                  info: { $ref: "#/components/schemas/AgentToken" }
                  mcp_url: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /agents/{handle}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/AgentHandle"
      - name: tokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeAgentToken
      summary: Revoke a token immediately
      tags: [agents]
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Error" }

  /secrets:
    get:
      operationId: listSecrets
      summary: Secret names and metadata (values are never returned)
      tags: [secrets]
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setSecret
      summary: Create or replace a secret's value (409 when SECRETS_KEY isn't set)
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name: { type: string }
                value: { type: string }
                grants_scope: { type: string }
                project_key: { type: string, description: Omit for a workspace-wide secret }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretInfo" }
        default: { $ref: "#/components/responses/Error" }

  /secrets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteSecret
      summary: Delete a secret
      tags: [secrets]
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Error" }

  /approvals/{id}/{decision}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: decision
        in: path
        required: true
        schema: { type: string, enum: [approve, deny] }
    post:
      operationId: decideApproval
      summary: Approve or deny an agent's request. The run resumes with the decision.
      tags: [runs]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/{key}/dispatch:
    parameters:
      - $ref: "#/components/parameters/TicketKey"
    get:
      operationId: getDispatchPreview
      summary: Exactly what a run of this ticket would get, for the dispatch dialog
      tags: [runs]
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchPreview" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: dispatchTicket
      summary: "Approve & dispatch: queue a managed run for the assigned agent"
      tags: [runs]
      responses:
        "200":
          description: The ticket, with its queued run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Error" }

  /tickets/dispatch:
    post:
      operationId: dispatchTickets
      summary: Bulk dispatch (all or nothing)
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: array, items: { type: string }, minItems: 1, maxItems: 100 }
      responses:
        "200":
          description: How many were queued
          content:
            application/json:
              schema:
                type: object
                required: [dispatched]
                properties:
                  dispatched: { type: integer }
        default: { $ref: "#/components/responses/Error" }

  /runner:
    get:
      operationId: getRunnerStatus
      summary: Runner heartbeats, slots and the queue
      tags: [runs]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerStatus" }
        default: { $ref: "#/components/responses/Error" }

  /runner/environment:
    get:
      operationId: getRunnerEnvironment
      summary: Observed tools, dependencies and caches from workspace setup
      tags: [runs]
      parameters:
        - name: run_id
          in: query
          schema: { type: string, format: uuid }
          description: Return the environment recorded for this exact run
      responses:
        "200":
          description: Live runner capacity and the latest setup snapshots per runner and project (up to 50)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerEnvironment" }
        default: { $ref: "#/components/responses/Error" }

  /runs/{id}/turns/{seq}/log:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: seq
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getTurnLog
      summary: The raw harness stream of one turn (JSONL)
      tags: [runs]
      responses:
        "200":
          description: Raw log
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /costs:
    get:
      operationId: getCosts
      summary: Spend aggregated from run cost counters, for the Costs page and cost chips
      description: >-
        Every number is summed server-side from runs.cost_usd_micros (sub agent runs
        included), so breakdowns, days and chips reconcile with each other. Chat runs
        are split by the model of each reply. Omit from and to for all-time spend
        (cost chips); days are only listed when both are given.
      tags: [runs]
      parameters:
        - { name: from, in: query, description: First UTC day (inclusive), schema: { type: string, format: date } }
        - { name: to, in: query, description: Last UTC day (inclusive), schema: { type: string, format: date } }
        - { name: project, in: query, description: Project key, schema: { type: string } }
        - { name: ticket, in: query, description: Ticket key (its runs and their sub agents), schema: { type: string } }
        - { name: chat, in: query, description: Chat session id (every run segment of the chat), schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The cost report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostReport" }
        default: { $ref: "#/components/responses/Error" }

  /runs:
    get:
      operationId: listRuns
      summary: Top-level runs, newest first, 50 per page (delegated runs are counted in child_count; a ticket filter lists them too)
      tags: [runs]
      parameters:
        - name: state
          in: query
          description: "live (queued to waiting, the default), all, or one run state"
          schema: { type: string, enum: [live, all, queued, starting, running, waiting, paused, blocked, completed, failed, cancelled], default: live }
        - { name: agent, in: query, description: Agent handle, schema: { type: string } }
        - { name: project, in: query, description: Project key, schema: { type: string } }
        - { name: purpose, in: query, schema: { type: string, enum: [ticket, planning, chat] } }
        - { name: ticket, in: query, description: "Ticket key: every run on that ticket, delegated runs included", schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: A page of runs
          content:
            application/json:
              schema:
                type: object
                required: [runs, has_more]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  has_more: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRun
      summary: A run with its turns, plan, approvals and events (the run log)
      tags: [runs]
      parameters:
        - name: after
          in: query
          description: Only events after this sequence number
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        default: { $ref: "#/components/responses/Error" }

  /runs/{id}/{action}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [pause, resume, cancel, retry] }
    post:
      operationId: controlRun
      summary: Pause, resume or cancel a run, or retry a failed one (returns the new run)
      tags: [runs]
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/pages:
    get:
      operationId: listWikiPages
      summary: Every wiki page (the page tree), with pending suggestion counts
      tags: [wiki]
      responses:
        "200":
          description: Pages, sorted by path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiTree" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWikiPage
      summary: Create a page at a path
      tags: [wiki]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewWikiPage" }
      responses:
        "201":
          description: The new page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/page:
    get:
      operationId: getWikiPage
      summary: A page by path (or a renamed page's old path)
      tags: [wiki]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/patterns:
    get:
      operationId: findPatterns
      summary: Find published patterns (Patterns/<Topic>/<Title>) by fuzzy search; an empty q browses by topic then title
      tags: [wiki]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: topic
          in: query
          description: Go, React, Postgres, Testing, API, Architecture or Process
          schema: { type: string }
        - name: tag
          in: query
          description: Only patterns with every one of these tags (repeat for several; AND)
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: limit
          in: query
          description: Default 10, at most 50
          schema: { type: integer }
      responses:
        "200":
          description: Matching patterns, best first
          content:
            application/json:
              schema:
                type: object
                required: [patterns, tags]
                properties:
                  patterns: { type: array, items: { $ref: "#/components/schemas/WikiPattern" } }
                  tags:
                    type: array
                    description: Tag facet for q and topic (before the tag filter), most used first
                    items: { $ref: "#/components/schemas/TagCount" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/adrs:
    get:
      operationId: listWikiADRs
      summary: Architecture decisions (wiki pages titled "ADR …" and ADR documents) with the status and open questions parsed from their body
      tags: [wiki]
      responses:
        "200":
          description: ADRs with open questions first, then newest first
          content:
            application/json:
              schema:
                type: object
                required: [adrs]
                properties:
                  adrs: { type: array, items: { $ref: "#/components/schemas/WikiADR" } }
        default: { $ref: "#/components/responses/Error" }

  /wiki/pages/{id}/citations:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: getWikiCitations
      summary: Runs and chats that read a page (or any document), from recorded reads
      tags: [wiki]
      responses:
        "200":
          description: Citations, most recent first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiCitations" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/pages/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    put:
      operationId: saveWikiPage
      summary: Save a page's body (a new version, silently) and/or move it to a new path
      tags: [wiki]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiPageSave" }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /wiki/suggestions:
    get:
      operationId: listWikiSuggestions
      summary: Agent edits waiting for a person, oldest first
      tags: [wiki]
      parameters:
        - name: artifact_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Pending suggestions
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions: { type: array, items: { $ref: "#/components/schemas/WikiSuggestion" } }
        default: { $ref: "#/components/responses/Error" }

  /wiki/suggestions/{versionId}/{decision}:
    parameters:
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: decision
        in: path
        required: true
        schema: { type: string, enum: [accept, reject] }
    post:
      operationId: decideWikiSuggestion
      summary: Accept (publish as the next version) or reject a suggestion
      tags: [wiki]
      responses:
        "204": { description: Decided }
        default: { $ref: "#/components/responses/Error" }

  /wiki/export:
    get:
      operationId: exportWiki
      summary: Every page as an Obsidian-compatible vault (zip of markdown files)
      tags: [wiki]
      responses:
        "200":
          description: Zip archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /wiki/import:
    post:
      operationId: importWiki
      summary: Import a vault zip; each .md file creates or replaces the page at its path
      tags: [wiki]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiImportResult" }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/resolve:
    get:
      operationId: resolveLinks
      summary: Resolve [[link]] texts to what they point at (for rendering)
      tags: [knowledge]
      parameters:
        - name: ref
          in: query
          required: true
          description: Link texts as written inside [[…]], without the brackets
          style: form
          explode: true
          schema: { type: array, items: { type: string }, maxItems: 200 }
      responses:
        "200":
          description: One entry per distinct ref
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links: { type: array, items: { $ref: "#/components/schemas/ResolvedLink" } }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/suggest:
    get:
      operationId: suggestLinks
      summary: "[[ autocomplete over pages, artifacts, tickets, epics and agents"
      tags: [knowledge]
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Candidates, best first
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets: { type: array, items: { $ref: "#/components/schemas/LinkTarget" } }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/backlinks:
    get:
      operationId: getBacklinks
      summary: Linked and unlinked mentions of an artifact, ticket, epic or agent
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/NodeKind"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Mentions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backlinks" }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/link-mention:
    post:
      operationId: linkMention
      summary: Turn the first unlinked mention of a target in a source into a [[link]]
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_kind, target_id, source_kind, source_id]
              properties:
                target_kind: { $ref: "#/components/schemas/NodeKind" }
                target_id: { type: string, format: uuid }
                source_kind: { type: string, enum: [artifact, ticket] }
                source_id: { type: string, format: uuid }
      responses:
        "204": { description: Linked }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/graph:
    get:
      operationId: getGraph
      summary: The local link graph around a node (1–2 hops, both directions)
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/NodeKind"
        - $ref: "#/components/parameters/NodeId"
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 2 }
      responses:
        "200":
          description: Nodes and edges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Graph" }
        default: { $ref: "#/components/responses/Error" }

  /knowledge/search:
    get:
      operationId: searchKnowledge
      summary: Full-text search over pages, artifacts and tickets, boosted by links
      tags: [knowledge]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: kind
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
      responses:
        "200":
          description: Hits
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        default: { $ref: "#/components/responses/Error" }

  /planning-sessions:
    get:
      operationId: listPlanningSessions
      responses:
        '200':
          description: Recent planning sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanningSession' }
    post:
      operationId: startPlanning
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanningInput' }
      responses:
        '201':
          description: Approved planning run queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningSession' }
  /planning-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPlanningSession
      responses:
        '200':
          description: Planning session and draft proposals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningSession' }
    patch:
      operationId: reviewPlanning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, action, proposals]
              properties:
                revision: { type: integer }
                action: { type: string, enum: [save, accept, dismiss] }
                proposals:
                  type: array
                  items: { $ref: '#/components/schemas/TicketProposal' }
      responses:
        '200':
          description: Draft saved, accepted or dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningSession' }

  /projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: Active and archived workspace projects
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Project' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewProject' }
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
  /saved-views:
    get:
      operationId: listSavedViews
      summary: The signed-in person's saved ticket-list views, by name
      tags: [tickets]
      responses:
        "200":
          description: Saved views, ordered by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedViewList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSavedView
      summary: Save a ticket-list view for the signed-in person
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedViewInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        default: { $ref: "#/components/responses/Error" }
  /saved-views/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSavedView
      summary: Rename a saved view or replace its query
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedViewPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSavedView
      summary: Delete a saved view (tickets are untouched)
      tags: [tickets]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /memories:
    get:
      operationId: listMemories
      summary: The signed-in person's assistant memories, newest change first (or ranked by q)
      description: |
        Memory is strictly per person: only the signed-in person's entries are
        ever returned. With q, results are ranked by full-text relevance over
        title, tags, summary and body (plus fuzzy title matching).
      tags: [memories]
      parameters:
        - { name: q, in: query, description: Search text, schema: { type: string, maxLength: 500 } }
        - { name: type, in: query, description: Only entries of this type, schema: { $ref: "#/components/schemas/MemoryType" } }
        - { name: include_retired, in: query, description: Also list entries superseded by newer ones, schema: { type: boolean, default: false } }
        - { name: offset, in: query, description: "Skip this many (listing only; search returns the top 50)", schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: Memories, 50 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryList" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAllMemories
      summary: Forget everything the assistant remembers about the signed-in person
      tags: [memories]
      parameters:
        - { name: confirm, in: query, required: true, description: Must be true; guards against accidental wipes, schema: { type: boolean } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, description: Entries deleted (not counting retired entries they superseded) }
        default: { $ref: "#/components/responses/Error" }
  /memories/export:
    get:
      operationId: exportMemories
      summary: Every memory of the signed-in person, retired entries included, oldest first
      tags: [memories]
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryExport" }
        default: { $ref: "#/components/responses/Error" }
  /memories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMemory
      summary: One memory entry; another person's entry is a 404
      tags: [memories]
      responses:
        "200":
          description: Memory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMemory
      summary: Edit a memory entry, retire it (superseded_by) or restore it (restore)
      description: Text that looks like a credential or token is refused with 422.
      tags: [memories]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMemory
      summary: Forget a memory entry and the retired entries it superseded
      tags: [memories]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /projects/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Updated project (key is immutable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{key}/board:
    parameters:
      - { name: key, in: path, required: true, description: "Project key, e.g. PAY", schema: { type: string } }
    get:
      operationId: getProjectBoard
      summary: Kanban board for a project, optionally one epic
      description: |
        One column per status in workflow order (backlog, todo, in_progress,
        in_review, done; canceled only when `include_canceled`). Cards are
        ordered by priority (urgent first), then `sort_order`, then ticket
        number; there's no manual ranking in v1. The done and canceled
        columns hold the 50 most recently updated cards (`truncated` says
        when more exist). "Blocked" is not a column: cards with
        `unmet_dependencies > 0` show a badge.
      tags: [tickets]
      parameters:
        - { name: epic, in: query, description: Only tickets in this epic; also fills `epic`, schema: { type: string, format: uuid } }
        - { name: assignee, in: query, description: Agent handle, schema: { type: string } }
        - { name: include_canceled, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        default: { $ref: "#/components/responses/Error" }
  /tickets/{key}/dependencies:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    put:
      operationId: setTicketDependencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, blocked_by]
              properties:
                revision: { type: integer }
                blocked_by: { type: array, maxItems: 50, items: { type: string } }
      responses:
        '200':
          description: Updated ticket with dependency relationships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        default: { $ref: '#/components/responses/Error' }

  /chats:
    get:
      operationId: listChats
      summary: The local user's chats, most recently active first
      tags: [chats]
      parameters:
        - { name: project, in: query, description: Project key; omit for all projects, schema: { type: string } }
        - { name: archived, in: query, description: "true lists archived chats instead", schema: { type: boolean, default: false } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: Chats, 50 per page
          content:
            application/json:
              schema:
                type: object
                required: [chats, has_more]
                properties:
                  chats: { type: array, items: { $ref: "#/components/schemas/ChatSession" } }
                  has_more: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChat
      summary: Start a chat in a project
      description: |
        Creates an idle chat. Nothing runs until the first message. When
        `message` is set it is posted as the first message (same rules as
        POST /chats/{id}/messages). Every chat is with the workspace's
        Personal Assistant, created on first use. 422 for an unknown or
        archived project, or a harness/model not in GET /chat-models.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChat" }
      responses:
        "201":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: getChat
      tags: [chats]
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateChat
      summary: Rename, archive or restore a chat (revision-checked)
      description: Archiving ends the chat's current run and removes its workspace. 409 on a stale revision or while a turn is running.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatPatch" }
      responses:
        "200":
          description: The updated chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChat
      summary: Delete a chat and its messages
      description: Cancels a running turn first. The chat's runs stay for cost history.
      tags: [chats]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/messages:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    get:
      operationId: listChatMessages
      summary: Messages in order of seq
      tags: [chats]
      parameters:
        - { name: after, in: query, description: Only messages with a greater seq (refetch after chat.updated), schema: { type: integer, minimum: 0 } }
        - { name: before, in: query, description: Only messages with a smaller seq (page back through history), schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [messages, has_more]
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
                  has_more: { type: boolean, description: Older messages exist before the first one returned }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: postChatMessage
      summary: Send a message and start the assistant's turn
      description: |
        Stores the user message and queues a turn. The reply arrives
        later as an assistant message; watch for `chat.updated`.
        `harness`/`model` switch the chat from this message on (same harness:
        same session, new model; other harness: new session with a
        transcript handoff, see the ADR). 404 unknown chat; 409 while a turn
        is running or the chat is archived; 422 empty body, unknown
        harness/model, or a context ref outside the chat's project.
      tags: [chats]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChatMessage" }
      responses:
        "202":
          description: Message stored and turn queued
          content:
            application/json:
              schema:
                type: object
                required: [chat, message]
                properties:
                  chat: { $ref: "#/components/schemas/ChatSession" }
                  message: { $ref: "#/components/schemas/ChatMessage" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chats/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/ChatId" }
    post:
      operationId: cancelChatTurn
      summary: Stop the running turn
      description: Interrupts the current turn (like run pause, SIGINT then kill); the chat returns to idle with a system message. 409 when no turn is running.
      tags: [chats]
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /chat-models:
    get:
      operationId: listChatModels
      summary: Harnesses and models the chat picker offers
      description: Live model catalog for all supported harnesses. Local mode queries the installed CLIs using their existing logins; Docker mode queries provider APIs using stored secrets. A harness is unavailable when discovery fails or no chat models are returned.
      tags: [chats]
      responses:
        "200":
          description: Harnesses in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatHarnessModels" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    NodeKind:
      name: kind
      in: query
      required: true
      schema: { $ref: "#/components/schemas/NodeKind" }
    NodeId:
      name: id
      in: query
      required: true
      schema: { type: string, format: uuid }
    TicketKey:
      name: key
      in: path
      required: true
      description: Ticket key, e.g. PAY-214
      schema: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}-[0-9]+$" }

    AgentHandle:
      name: handle
      in: path
      required: true
      schema: { type: string }
    ArtifactId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChatId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, version, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/HealthCheck" }
    HealthCheck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        latency_ms: { type: integer }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [not_found, invalid, conflict, internal, no_user] }
        message: { type: string }
        field: { type: string }

    Workspace:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    User:
      type: object
      required: [id, name, email, initials, role_title]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        initials: { type: string }
        role_title: { type: string }
        avatar_color: { type: string }
    Project:
      type: object
      required: [id, key, name, color, default_branch, archived, revision]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        color: { type: string }
        repo_url: { type: string, description: "GitHub URL: git@github.com:owner/repo[.git], ssh://git@github.com/owner/repo[.git], or https://github.com/owner/repo[.git] (stored in SSH form). Legacy HTTPS values are kept until changed." }
        default_branch: { type: string }
        archived: { type: boolean }
        revision: { type: integer }
    AgentKind:
      type: string
      enum: [main, sub, assistant]
      description: "main agents are assigned tickets and may delegate parts of them; sub agents only run when a main agent delegates to them; the assistant is the workspace's Personal Assistant, which every chat runs as (it can't be created, edited, deleted or assigned tickets)"
    Agent:
      type: object
      required: [id, name, handle, kind, color_index, role, specialty, model, status]
      properties:
        kind: { $ref: "#/components/schemas/AgentKind" }
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        color_index: { type: integer }
        role: { type: string }
        specialty: { type: string }
        model: { type: string }
        status: { type: string, enum: [running, waiting, blocked, idle] }
    Epic:
      type: object
      required: [id, project_id, name, health, requires_mockup, status, criteria_total, criteria_done, points_total, points_done, tickets_total, tickets_open]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        health: { type: string, enum: [on_track, at_risk, off_track] }
        requires_mockup: { type: boolean, description: Tickets in this epic need a person-approved UI mockup }
        status: { $ref: "#/components/schemas/EpicStatus" }
        criteria_total: { type: integer, description: Epic acceptance criteria }
        criteria_done: { type: integer }
        points_total: { type: integer, description: "Sum of estimate_points over the epic's tickets, canceled excluded" }
        points_done: { type: integer, description: Sum of estimate_points over its done tickets }
        tickets_total: { type: integer, description: "Tickets in the epic, canceled excluded" }
        tickets_open: { type: integer, description: Tickets not done or canceled }
    EpicStatus:
      type: string
      enum: [open, done]
      description: "done is gated: all criteria checked and every ticket done or canceled (409 otherwise)"
    EpicCriterion:
      type: object
      required: [id, epic_id, position, text, done]
      properties:
        id: { type: string, format: uuid }
        epic_id: { type: string, format: uuid }
        position: { type: integer, description: 1-based; agents address criteria by this number }
        text: { type: string }
        done: { type: boolean }
        checked_by: { $ref: "#/components/schemas/Actor" }
        checked_at: { type: string, format: date-time }
    EstimatePoints:
      type: integer
      minimum: 0
      maximum: 100
      description: |
        Story points. The server accepts only the configured scale (v1:
        Fibonacci 1, 2, 3, 5, 8, 13) and answers 422 with field
        `estimate_points` for anything else; the schema bound is wider so the
        scale can change without a contract change.
    Board:
      type: object
      required: [project, columns]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        epic: { $ref: "#/components/schemas/BoardEpic" }
        columns: { type: array, items: { $ref: "#/components/schemas/BoardColumn" } }
    BoardColumn:
      type: object
      required: [status, cards, count, points, truncated]
      properties:
        status: { $ref: "#/components/schemas/TicketStatus" }
        cards: { type: array, items: { $ref: "#/components/schemas/TicketSummary" } }
        count: { type: integer, description: "All tickets in the column, including ones cut by truncation" }
        points: { type: integer, description: "Sum of estimate_points over all tickets in the column, truncated ones included" }
        truncated: { type: boolean }
    BoardEpic:
      type: object
      description: Set when the board is filtered to one epic
      required: [epic, criteria, done_blockers]
      properties:
        epic: { $ref: "#/components/schemas/Epic" }
        objective: { type: string }
        criteria: { type: array, items: { $ref: "#/components/schemas/EpicCriterion" } }
        done_blockers:
          type: object
          description: What stops the epic from moving to done; both empty means it can
          required: [open_tickets, unchecked_criteria]
          properties:
            open_tickets: { type: array, items: { type: string }, description: Ticket keys not done or canceled }
            unchecked_criteria: { type: array, items: { type: integer }, description: Criterion positions }
        review:
          description: "The epic's final review ticket, once it exists"
          allOf: [{ $ref: "#/components/schemas/WorkTicket" }]
    Label:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
    Bootstrap:
      type: object
      required: [workspace, me, users, projects, agents, epics, labels, counts]
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        me: { $ref: "#/components/schemas/User" }
        users: { type: array, items: { $ref: "#/components/schemas/User" } }
        projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        epics: { type: array, items: { $ref: "#/components/schemas/Epic" } }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        counts:
          type: object
          required: [inbox, live_agents, wiki_suggestions]
          properties:
            inbox: { type: integer }
            wiki_suggestions: { type: integer }
            live_agents: { type: integer }

    TicketStatus:
      type: string
      enum: [backlog, todo, in_progress, in_review, done, canceled]
      description: "canceled is set by people only; it is excluded from the active, backlog and agent_owned views, from dispatch and from epic point totals"
    Priority:
      type: string
      enum: [none, low, medium, high, urgent]
    AgentRef:
      type: object
      required: [id, name, handle, color_index]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        color_index: { type: integer }
    UserRef:
      type: object
      required: [id, name, initials]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        initials: { type: string }
        avatar_color: { type: string }
    EpicRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    PullRequest:
      type: object
      required: [number, state]
      properties:
        number: { type: integer }
        state: { type: string, enum: [draft, open, merged, closed] }
        url: { type: string }
        additions: { type: integer }
        deletions: { type: integer }
        closed_unmerged: { type: boolean, description: Closed without merging; a person should look }
        synced_at: { type: string, format: date-time }

    TicketSummary:
      type: object
      required: [id, key, project_key, title, status, priority, labels, criteria_total, criteria_done, unmet_dependencies, updated_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        project_key: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        epic: { $ref: "#/components/schemas/EpicRef" }
        assignee: { $ref: "#/components/schemas/AgentRef" }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        due_date: { type: string, format: date }
        pr: { $ref: "#/components/schemas/PullRequest" }
        unmet_dependencies: { type: integer, description: "Blockers not done yet; > 0 shows the blocked badge" }
        criteria_total: { type: integer }
        criteria_done: { type: integer }
        estimate_points: { $ref: "#/components/schemas/EstimatePoints" }
        updated_at: { type: string, format: date-time }
    TicketList:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items: { $ref: "#/components/schemas/TicketSummary" }
    SavedView:
      type: object
      description: |
        A named ticket-list view owned by one person. query is the list's URL
        search string without project (e.g. "view=active&group=epic"), so the
        view applies to whichever project is current.
      required: [id, name, query, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        query: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedViewList:
      type: object
      required: [views]
      properties:
        views:
          type: array
          items: { $ref: "#/components/schemas/SavedView" }
    SavedViewInput:
      type: object
      required: [name, query]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "Unique per person, ignoring case; a duplicate is 409" }
        query: { type: string, maxLength: 2000 }
    SavedViewPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        query: { type: string, maxLength: 2000 }
    MemoryType:
      type: string
      description: "One of preference, project, person, life, work, fact, other"
    Memory:
      type: object
      description: |
        One thing the personal assistant remembers about its person, kept apart
        from the shared wiki. superseded_by marks a retired entry and names the
        entry that replaced it.
      required: [id, title, summary, body, tags, type, source, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string, description: One line }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        type: { $ref: "#/components/schemas/MemoryType" }
        source: { type: string, description: "Where it came from in words, e.g. chat <id> or manual" }
        source_chat_id: { type: string, format: uuid, description: The chat it came from, while that chat exists }
        source_run_id: { type: string, format: uuid, description: The run that wrote it, while that run exists }
        superseded_by: { type: string, format: uuid, description: Set when retired in favour of this newer entry }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemoryList:
      type: object
      required: [memories, total, has_more]
      properties:
        memories: { type: array, items: { $ref: "#/components/schemas/Memory" } }
        total: { type: integer, description: "Entries matching type and include_retired (q not applied)" }
        has_more: { type: boolean }
    MemoryExport:
      type: object
      required: [exported_at, memories]
      properties:
        exported_at: { type: string, format: date-time }
        memories: { type: array, items: { $ref: "#/components/schemas/Memory" } }
    MemoryPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 20000 }
        tags: { type: array, maxItems: 12, items: { type: string, maxLength: 40 } }
        type: { $ref: "#/components/schemas/MemoryType" }
        superseded_by: { type: string, format: uuid, description: Retire this entry in favour of another current entry }
        restore: { type: boolean, description: true clears superseded_by }
    Ticket:
      type: object
      required: [id, key, project, title, description_md, status, priority, labels, criteria, artifacts, approvals, blocked_by, blocks, revision, dependency_revision, requires_mockup, epic_review, mockup_gate, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        project: { $ref: "#/components/schemas/Project" }
        title: { type: string }
        description_md: { type: string }
        revision: { type: integer, description: Bumped on every field change; send it back in TicketPatch.revision }
        dependency_revision: { type: integer }
        blocked_by: { type: array, items: { $ref: '#/components/schemas/TicketDependency' } }
        blocks: { type: array, items: { $ref: '#/components/schemas/TicketDependency' } }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        epic: { $ref: "#/components/schemas/EpicRef" }
        assignee: { $ref: "#/components/schemas/AgentRef" }
        reviewer: { $ref: "#/components/schemas/UserRef" }
        created_by: { $ref: "#/components/schemas/UserRef" }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        criteria: { type: array, items: { $ref: "#/components/schemas/Criterion" } }
        artifacts: { type: array, items: { $ref: "#/components/schemas/DocCard" } }
        run: { $ref: "#/components/schemas/Run" }
        approvals:
          type: array
          description: Pending approval requests on this ticket
          items: { $ref: "#/components/schemas/Approval" }
        estimate: { type: string, description: "Legacy free-text sizing note (e.g. \"L · ~6h\"); kept as is, superseded by estimate_points" }
        estimate_points: { $ref: "#/components/schemas/EstimatePoints" }
        estimate_rationale: { type: string, description: Why the estimator chose the points (agents give one; people may leave it empty) }
        estimated_by: { $ref: "#/components/schemas/Actor" }
        estimated_at: { type: string, format: date-time }
        due_date: { type: string, format: date }
        branch: { type: string }
        pr: { $ref: "#/components/schemas/PullRequest" }
        requires_mockup: { type: boolean, description: This ticket itself is flagged (its epic may also require one) }
        epic_review: { type: boolean, description: "The epic's final review: created by the server, it consolidates the epic's branches and runs its tests once" }
        mockup_gate: { $ref: "#/components/schemas/MockupGate" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MockupRef:
      type: object
      required: [id, title, version_id, version_label, review_state, review_note]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        version_id: { type: string, format: uuid }
        version_label: { type: string }
        review_state: { $ref: "#/components/schemas/MockupReviewState" }
        review_note: { type: string }
    MockupGate:
      type: object
      description: Whether the ticket needs a person-approved UI mockup before implementation can finish
      required: [required, from_epic, approved, mockups]
      properties:
        required: { type: boolean }
        from_epic: { type: boolean, description: Required only because the ticket's epic says so }
        approved: { type: boolean, description: A candidate mockup's current version is approved }
        mockups:
          type: array
          description: Mockups attached to the ticket or in its epic (current versions)
          items: { $ref: "#/components/schemas/MockupRef" }
    MockupReviewState:
      type: string
      enum: [pending, approved, changes_requested]
    MockupReview:
      type: object
      required: [state, note, pins]
      properties:
        state: { $ref: "#/components/schemas/MockupReviewState" }
        note: { type: string, description: "The reviewer's note, followed by the pinned comments as a numbered list" }
        pins:
          type: array
          description: Comments pinned on this version, numbered by position (the first is 1)
          items: { $ref: "#/components/schemas/MockupPin" }
        reviewed_by: { $ref: "#/components/schemas/UserRef" }
        reviewed_at: { type: string, format: date-time }
    MockupPin:
      type: object
      required: [x, y, text]
      properties:
        x: { type: number, format: double, minimum: 0, maximum: 1, description: Horizontal position as a fraction of the drawing's width }
        y: { type: number, format: double, minimum: 0, maximum: 1, description: Vertical position as a fraction of the drawing's height }
        text: { type: string, minLength: 1, maxLength: 500 }
    Criterion:
      type: object
      required: [id, position, text, done]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        text: { type: string }
        done: { type: boolean }

    NewTicket:
      type: object
      required: [project_key, title]
      properties:
        project_key: { type: string }
        title: { type: string, minLength: 1, maxLength: 300 }
        description_md: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        epic_id: { type: string, format: uuid }
        assignee_agent_id: { type: string, format: uuid }
        reviewer_user_id: { type: string, format: uuid }
        label_ids: { type: array, items: { type: string, format: uuid } }
        estimate: { type: string }
        estimate_points: { $ref: "#/components/schemas/EstimatePoints" }
        due_date: { type: string, format: date }
        criteria: { type: array, items: { type: string } }
        requires_mockup: { type: boolean }
    TicketPatch:
      type: object
      properties:
        revision:
          type: integer
          description: "Expected current Ticket.revision; stale → 409. Not allowed in BulkUpdate.patch (422)."
        title: { type: string, minLength: 1, maxLength: 300 }
        description_md: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        epic_id: { type: string, format: uuid, nullable: true }
        assignee_agent_id: { type: string, format: uuid, nullable: true }
        reviewer_user_id: { type: string, format: uuid, nullable: true }
        estimate: { type: string, nullable: true }
        estimate_points:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: "Same scale as EstimatePoints; null clears. Records the person as estimated_by and clears the rationale."
        due_date: { type: string, format: date, nullable: true }
        label_ids: { type: array, items: { type: string, format: uuid } }
        requires_mockup: { type: boolean }
        criteria: { $ref: "#/components/schemas/TicketCriteriaDraft" }
    TicketCriteriaDraft:
      type: object
      description: |
        Replaces the ticket's acceptance criteria atomically with the ticket
        fields (ADR-034). Requires revision. expected is the complete criteria
        list the client started from; if it no longer matches, nothing changes
        and the server answers 409 with field criteria. items order defines the
        final positions; existing IDs are kept, items without id are created and
        omitted IDs are deleted. Not allowed in BulkUpdate.patch (422).
      required: [expected, items]
      properties:
        expected:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Criterion" }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/TicketCriterionDraft" }
    TicketCriterionDraft:
      type: object
      required: [text, done]
      properties:
        id: { type: string, format: uuid, description: "Existing criterion of this ticket; omit to create" }
        text: { type: string, minLength: 1, maxLength: 1000 }
        done: { type: boolean }
    BulkUpdate:
      type: object
      required: [keys, patch]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        patch: { $ref: "#/components/schemas/TicketPatch" }
        attach_artifact_id:
          type: string
          format: uuid
          description: Also attach this artifact (as context) to every ticket

    ArtifactType:
      type: string
      enum: [prd, spec, adr, report, design, note, mockup]
    ArtifactRelation:
      type: string
      enum: [context, generated]
    ArtifactContent:
      type: object
      required: [kind, content_type, size_bytes, sections]
      properties:
        kind: { type: string, enum: [markdown, svg, file] }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        filename: { type: string }
        sections: { type: integer, description: Headings in the outline (markdown only) }
    ArtifactSummary:
      type: object
      required: [id, type, title, summary, author, content, ticket_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ArtifactType" }
        title: { type: string }
        display_id: { type: string, description: "ADR-012; set for numbered types" }
        summary: { type: string }
        project: { $ref: "#/components/schemas/Project" }
        path: { type: string, description: Notes only }
        epic: { $ref: "#/components/schemas/EpicRef" }
        author: { $ref: "#/components/schemas/Actor" }
        version_label: { type: string }
        content: { $ref: "#/components/schemas/ArtifactContent" }
        review_state: { $ref: "#/components/schemas/MockupReviewState" }
        ticket_count: { type: integer }
        updated_at: { type: string, format: date-time }
    ArtifactCounts:
      type: object
      required: [all, prd, spec, adr, report, design, note, mockup]
      properties:
        all: { type: integer, description: Everything except notes }
        note: { type: integer }
        prd: { type: integer }
        spec: { type: integer }
        adr: { type: integer }
        report: { type: integer }
        design: { type: integer }
        mockup: { type: integer }
    ArtifactList:
      type: object
      required: [artifacts, counts]
      properties:
        artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactSummary" } }
        counts: { $ref: "#/components/schemas/ArtifactCounts" }
    ArtifactVersion:
      type: object
      required: [id, seq, label, note, content, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        label: { type: string }
        note: { type: string }
        content: { $ref: "#/components/schemas/ArtifactContent" }
        review: { $ref: "#/components/schemas/MockupReview" }
        created_by: { $ref: "#/components/schemas/Actor" }
        created_at: { type: string, format: date-time }
    OutlineSection:
      type: object
      required: [id, level, anchor, heading, citations]
      properties:
        id: { type: string, format: uuid }
        level: { type: integer }
        anchor: { type: string }
        heading: { type: string }
        citations: { type: integer, description: Times agents cited this section (by anchor, across versions) }
    ArtifactReader:
      type: object
      required: [agent, reads, last_read_at]
      properties:
        agent: { $ref: "#/components/schemas/AgentRef" }
        reads: { type: integer }
        last_read_at: { type: string, format: date-time }
    LinkedTicket:
      type: object
      required: [key, title, status, relation]
      properties:
        key: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        relation: { $ref: "#/components/schemas/ArtifactRelation" }
    Artifact:
      type: object
      required: [id, type, title, summary, author, current_version, body_md, outline, read_by, versions, tickets, suggestions, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ArtifactType" }
        title: { type: string }
        display_id: { type: string }
        summary: { type: string }
        project: { $ref: "#/components/schemas/Project" }
        path: { type: string, description: "Notes: Payments/Ledger/Rollback runbook" }
        suggestions: { type: integer, description: Pending agent suggestions (notes) }
        epic: { $ref: "#/components/schemas/EpicRef" }
        author: { $ref: "#/components/schemas/Actor" }
        current_version: { $ref: "#/components/schemas/ArtifactVersion" }
        body_md:
          type: string
          nullable: true
          description: Markdown, or SVG source for mockups; null for files
        outline: { type: array, items: { $ref: "#/components/schemas/OutlineSection" } }
        read_by: { type: array, items: { $ref: "#/components/schemas/ArtifactReader" } }
        versions: { type: array, items: { $ref: "#/components/schemas/ArtifactVersion" } }
        tickets: { type: array, items: { $ref: "#/components/schemas/LinkedTicket" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocCard:
      type: object
      required: [id, type, title, relation, author, read_by_assignee]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ArtifactType" }
        title: { type: string }
        display_id: { type: string }
        version_label: { type: string }
        relation: { $ref: "#/components/schemas/ArtifactRelation" }
        author: { $ref: "#/components/schemas/Actor" }
        read_by_assignee: { type: boolean, description: "The ticket's agent has read it (\"Read by Atlas\")" }
        review_state: { $ref: "#/components/schemas/MockupReviewState" }
    NewArtifact:
      type: object
      required: [project_key, type]
      properties:
        project_key: { type: string }
        type: { $ref: "#/components/schemas/ArtifactType" }
        title: { type: string }
        summary: { type: string }
        epic_id: { type: string, format: uuid }
        version_label: { type: string }
        body_md: { type: string, description: "Markdown text, or SVG source for type mockup (self-contained: no scripts or external references)" }
        file: { type: string, format: binary, description: "Mockups accept an .svg file, which is stored as text" }
        ticket_key: { type: string, description: "Also attach the new artifact to this ticket (relation context) in the same transaction. The ticket must be in the artifact's project; nothing is created on failure." }
    NewArtifactVersion:
      type: object
      properties:
        version_label: { type: string }
        note: { type: string }
        body_md: { type: string, description: "Markdown text, or SVG source for a mockup" }
        file: { type: string, format: binary }

    ScopeMode:
      type: string
      enum: [allowed, requires_approval, denied]
    Harness:
      type: string
      enum: [claude-code, codex, opencode]
    Budget:
      type: object
      properties:
        max_runtime: { type: string, description: "Go duration, e.g. 2h" }
        max_turns: { type: integer }
    McpServer:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
        description: { type: string }
    HarnessFallback:
      type: object
      required: [harness, model]
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        harness_options:
          type: object
          additionalProperties: { type: string }
    AgentSpec:
      type: object
      required: [harness, model, instructions, scopes, budget, max_concurrency, mcp_servers, harness_options]
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        fallbacks: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/HarnessFallback" } }
        instructions: { type: string }
        review_required: { type: boolean, default: false, description: Require independent reviewer or QA approval before Done }
        scopes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ScopeMode" }
        budget: { $ref: "#/components/schemas/Budget" }
        max_concurrency: { type: integer }
        mcp_servers: { type: array, items: { $ref: "#/components/schemas/McpServer" } }
        harness_options:
          type: object
          description: Per-harness key/values passed only to that harness's adapter
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        memory: { $ref: "#/components/schemas/AgentMemory" }
        skills:
          type: array
          description: Playbooks the agent loads on demand (native skills on Claude Code, an AGENTS.md index elsewhere)
          items: { $ref: "#/components/schemas/AgentSkill" }
    AgentSkill:
      type: object
      required: [name, description, body]
      properties:
        name: { type: string, description: "Lowercase letters, digits and -; becomes the skill's folder" }
        description: { type: string, description: When to use it. The agent matches tasks against this line }
        body: { type: string, description: Markdown instructions }
    AgentOverride:
      type: object
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        instructions_append: { type: string }
        skills_add: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/AgentSkill" }, description: "Skills appended after removals; existing names are skipped unless removed first." }
        skills_remove: { type: array, items: { type: string }, description: "Agent skill names to remove; unknown names are ignored." }
        scopes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ScopeMode" }
        budget: { $ref: "#/components/schemas/Budget" }
        mcp_servers_add: { type: array, items: { $ref: "#/components/schemas/McpServer" } }
        setup: { type: array, items: { type: string } }
    ResolvedScope:
      type: object
      required: [scope, mode, source, enforcement, how, description]
      properties:
        scope: { type: string }
        mode: { $ref: "#/components/schemas/ScopeMode" }
        source: { type: string, enum: [agent, project] }
        enforcement: { type: string, enum: [credential, brokered, harness, none] }
        how: { type: string }
        description: { type: string }
    ResolvedDefinition:
      type: object
      required: [harness, model, instructions, scopes, budget, max_concurrency, mcp_servers, harness_options, setup, provenance]
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        fallbacks: { type: array, items: { $ref: "#/components/schemas/HarnessFallback" } }
        instructions: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/ResolvedScope" } }
        budget: { $ref: "#/components/schemas/Budget" }
        max_concurrency: { type: integer }
        mcp_servers: { type: array, items: { $ref: "#/components/schemas/McpServer" } }
        harness_options:
          type: object
          additionalProperties: { type: string }
        setup: { type: array, items: { type: string } }
        memory: { $ref: "#/components/schemas/AgentMemory" }
        skills: { type: array, items: { $ref: "#/components/schemas/AgentSkill" } }
        provenance:
          type: object
          description: Fields a project changed, e.g. {"harness":"project"}
          additionalProperties: { type: string, enum: [agent, project] }
    DefinitionVersion:
      type: object
      required: [id, version, note, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        note: { type: string }
        created_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
    ProjectOverride:
      type: object
      required: [project, override, changes, version, updated_at]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        override: { $ref: "#/components/schemas/AgentOverride" }
        changes: { type: array, items: { type: string } }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    HarnessInfo:
      type: object
      required: [name, label, tool_gating, permission_prompt, native_cost, resume]
      properties:
        name: { $ref: "#/components/schemas/Harness" }
        label: { type: string }
        tool_gating: { type: boolean }
        permission_prompt: { type: boolean }
        native_cost: { type: boolean }
        resume: { type: boolean }
    ScopeInfo:
      type: object
      required: [scope, description, brokered]
      properties:
        scope: { type: string }
        description: { type: string }
        secret: { type: string }
        brokered: { type: boolean }
        api_only: { type: boolean, description: "Only possible through the LazyAgents API (wiki edits), so every mode is enforced server-side" }
    AgentDetail:
      type: object
      required: [agent, specialty, definition, spec, versions, overrides, harnesses, catalog]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        specialty: { type: string }
        definition: { $ref: "#/components/schemas/DefinitionVersion" }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        versions: { type: array, items: { $ref: "#/components/schemas/DefinitionVersion" } }
        overrides: { type: array, items: { $ref: "#/components/schemas/ProjectOverride" } }
        harnesses: { type: array, items: { $ref: "#/components/schemas/HarnessInfo" } }
        catalog: { type: array, items: { $ref: "#/components/schemas/ScopeInfo" } }

    AgentToken:
      type: object
      required: [id, prefix, label, created_at]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string }
        label: { type: string }
        created_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    SecretInfo:
      type: object
      description: Secret metadata. Values are write-only; no part of a value is ever returned.
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        project: { $ref: "#/components/schemas/Project" }
        grants_scope: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    SecretList:
      type: object
      required: [secrets, key_configured, known]
      properties:
        secrets: { type: array, items: { $ref: "#/components/schemas/SecretInfo" } }
        key_configured: { type: boolean, description: SECRETS_KEY is set }
        known:
          type: array
          description: Well-known secret names and the scope each backs
          items:
            type: object
            required: [name, description]
            properties:
              name: { type: string }
              grants_scope: { type: string }
              description: { type: string }

    PlanStep:
      type: object
      required: [position, text, state]
      properties:
        position: { type: integer }
        text: { type: string }
        state: { type: string, enum: [pending, current, done, needs_human, failed] }
    CostReport:
      type: object
      required: [total, unpriced_runs, estimated, days, agents, projects, models, purposes, top_tickets]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { $ref: "#/components/schemas/CostSlice" }
        unpriced_runs: { type: integer, description: Runs whose cost is unknown or partial; totals are lower bounds }
        estimated:
          type: object
          description: Spend on estimated tickets and their points, for cost per point
          required: [tickets, points, cost_micros]
          properties:
            tickets: { type: integer }
            points: { type: integer }
            cost_micros: { type: integer, format: int64 }
        days: { type: array, description: Every UTC day in the range, oldest first, empty days included, items: { $ref: "#/components/schemas/CostDay" } }
        agents: { type: array, items: { $ref: "#/components/schemas/CostSlice" } }
        projects: { type: array, items: { $ref: "#/components/schemas/CostSlice" } }
        models: { type: array, description: "Keyed harness/model", items: { $ref: "#/components/schemas/CostSlice" } }
        purposes: { type: array, items: { $ref: "#/components/schemas/CostSlice" } }
        top_tickets: { type: array, description: The 10 most expensive tickets in the range, items: { $ref: "#/components/schemas/CostTicket" } }
    CostSlice:
      type: object
      description: One breakdown row; slices of a breakdown add up to the total. Runs can appear in several model slices.
      required: [key, label, runs, tokens, cost_micros, unpriced_runs]
      properties:
        key: { type: string }
        label: { type: string }
        detail: { type: string, description: "Harness for models, project key for projects" }
        runs: { type: integer }
        tokens: { type: integer, format: int64 }
        cost_micros: { type: integer, format: int64, description: Spend in millionths of a US dollar }
        unpriced_runs: { type: integer }
    CostPart:
      type: object
      required: [key, cost_micros]
      properties:
        key: { type: string }
        cost_micros: { type: integer, format: int64 }
    CostDay:
      type: object
      required: [date, runs, cost_micros, agents, models]
      properties:
        date: { type: string, format: date }
        runs: { type: integer }
        cost_micros: { type: integer, format: int64 }
        agents: { type: array, description: Keyed by agent handle, items: { $ref: "#/components/schemas/CostPart" } }
        models: { type: array, description: "Keyed harness/model", items: { $ref: "#/components/schemas/CostPart" } }
    CostTicket:
      type: object
      required: [key, title, project_key, cost_micros, runs]
      properties:
        key: { type: string }
        title: { type: string }
        project_key: { type: string }
        points: { type: integer }
        cost_micros: { type: integer, format: int64 }
        runs: { type: array, description: Runs behind the spend, sub agents included, newest first, items: { $ref: "#/components/schemas/CostRun" } }
    CostRun:
      type: object
      required: [id, agent, model, state, started_at, cost_micros]
      properties:
        id: { type: string, format: uuid }
        parent_run_id: { type: string, format: uuid }
        agent: { type: string, description: Agent handle }
        model: { type: string }
        state: { type: string }
        started_at: { type: string, format: date-time }
        cost_micros: { type: integer, format: int64 }
    Run:
      type: object
      required: [id, ticket_key, purpose, agent, mode, state, harness, model, started_at, tool_calls, input_tokens, output_tokens, cost_usd, plan, approval_scopes, scopes]
      properties:
        id: { type: string, format: uuid }
        ticket_key: { type: string, description: Empty for standalone planning runs }
        purpose: { type: string, enum: [ticket, planning, chat], description: "What the run works on: a ticket, a plan or a chat" }
        planning_id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid, description: The chat session of a chat run }
        project_key: { type: string, description: "Project of the ticket, plan or chat" }
        work_title: { type: string, description: "Ticket title, plan goal or chat title" }
        branch: { type: string, description: "Ticket runs: the ticket's branch" }
        pr_number: { type: integer }
        pr_url: { type: string }
        pr_state: { type: string }
        child_count: { type: integer, description: "Direct delegated runs" }
        agent: { $ref: "#/components/schemas/AgentRef" }
        mode: { type: string, enum: [managed, unmanaged] }
        state: { type: string, enum: [queued, starting, running, waiting, paused, blocked, completed, failed, cancelled] }
        session_id: { type: string, description: The harness session turns resume }
        dispatched_by: { $ref: "#/components/schemas/UserRef" }
        wait_reason: { type: string, enum: [approval, human_reply, pause, delegation, mockup_review], description: "delegation: waiting for a sub agent the run delegated to; mockup_review: waiting for a person to review a UI mockup" }
        parent_run_id: { type: string, format: uuid, description: "Set on a run a main agent delegated to a sub agent; it works in the parent's checkout" }
        harness: { type: string }
        model: { type: string }
        outcome: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        tool_calls: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cached_input_tokens: { type: integer, format: int64, description: Input served from cache where the provider reported cache usage }
        uncached_input_tokens: { type: integer, format: int64, description: Reported input not served from cache }
        unreported_input_tokens: { type: integer, format: int64, description: Input whose cache breakdown was not reported }
        cost_usd: { type: number }
        cost_source: { type: string, description: "harness, computed, self_reported, unknown, or partial" }
        setup_ms: { type: integer, format: int64, description: "Cumulative workspace setup time in milliseconds; absent if not timed" }
        harness_ms: { type: integer, format: int64, description: "Cumulative harness process time across all turns, in milliseconds; absent if not timed" }
        checks_ms: { type: integer, format: int64, description: "Time spent on the runner's post-run checks of this delegated run, in milliseconds; absent if not timed" }
        plan: { type: array, items: { $ref: "#/components/schemas/PlanStep" } }
        scopes:
          type: array
          description: Allowed scopes in the run's frozen definition
          items: { type: string }
        approval_scopes:
          type: array
          description: Scopes that need approval in this run
          items: { type: string }
    Approval:
      type: object
      required: [id, run_id, ticket_key, agent, scope, action_summary, action_detail, risk_summary, state, brokered, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        ticket_key: { type: string }
        agent: { $ref: "#/components/schemas/AgentRef" }
        scope: { type: string }
        action_summary: { type: string }
        action_detail:
          type: object
          additionalProperties: true
        action_preview: { type: string, description: "What will run, e.g. the SQL, for brokered scopes" }
        risk_summary: { type: string }
        state: { type: string, enum: [pending, approved, denied, expired] }
        brokered: { type: boolean }
        decided_by: { $ref: "#/components/schemas/UserRef" }
        decided_at: { type: string, format: date-time }
        decision_note: { type: string }
        executed_at: { type: string, format: date-time }
        result:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
    RunTurn:
      type: object
      required: [seq, trigger, input_message, started_at, status, has_log]
      properties:
        seq: { type: integer }
        trigger: { type: string, enum: [start, approval, comment, resume, delegation] }
        input_message: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        exit_code: { type: integer }
        status: { type: string, enum: [pending, running, done], description: "Managed turns: waiting for the runner, executing, exited" }
        process_started_at: { type: string, format: date-time }
        has_log: { type: boolean, description: "The raw stream is stored (GET …/turns/{seq}/log)" }
        usage:
          type: object
          additionalProperties: true
    RunEvent:
      type: object
      required: [seq, type, payload, at]
      properties:
        seq: { type: integer, format: int64 }
        type: { type: string, enum: [message, tool_call, tool_result, usage, error, lifecycle] }
        payload:
          type: object
          additionalProperties: true
        at: { type: string, format: date-time }
    RunDetail:
      type: object
      required: [run, turns, approvals, events, child_runs]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        child_runs:
          type: array
          description: Direct delegated runs, including active and finished runs. Fetch each run for its own events and cursor.
          items: { $ref: "#/components/schemas/Run" }
        turns: { type: array, items: { $ref: "#/components/schemas/RunTurn" } }
        approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        events: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }

    NewComment:
      type: object
      required: [body_md]
      properties:
        body_md: { type: string, minLength: 1, maxLength: 20000 }
        parent_comment_id: { type: string, format: uuid }
    Actor:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [user, agent, system] }
        id: { type: string, format: uuid }
        name: { type: string }
        initials: { type: string }
        avatar_color: { type: string }
        color_index: { type: integer }
    ActivityEvent:
      type: object
      required: [id, actor, verb, payload, created_at]
      description: |
        One timeline entry. `verb` says what happened; `payload` carries the
        details for that verb (see server/internal/tracker/activity.go).
      properties:
        id: { type: string, format: uuid }
        actor: { $ref: "#/components/schemas/Actor" }
        verb: { type: string }
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    NodeKind:
      type: string
      enum: [artifact, ticket, epic, agent]
    LinkTarget:
      type: object
      required: [kind, title]
      description: What a [[link]] points at, with enough to render it
      properties:
        kind: { type: string, enum: [artifact, section, ticket, epic, agent, comment, chat, unresolved], description: "chat only appears in GET /search hits (the asking user's own chats)" }
        id: { type: string, format: uuid }
        anchor: { type: string }
        title: { type: string }
        artifact_type: { $ref: "#/components/schemas/ArtifactType" }
        path: { type: string }
        display_id: { type: string }
        href: { type: string }
        status: { type: string }
        color_index: { type: integer }
    ResolvedLink:
      type: object
      required: [ref, target]
      properties:
        ref: { type: string }
        target: { $ref: "#/components/schemas/LinkTarget" }
    Mention:
      type: object
      required: [source_kind, source_id, source, snippets]
      properties:
        source_kind: { type: string, enum: [artifact, ticket, comment] }
        source_id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/LinkTarget" }
        snippets: { type: array, items: { type: string } }
        anchors: { type: array, items: { type: string }, description: Sections of the target it cites }
    Backlinks:
      type: object
      required: [linked, unlinked]
      properties:
        linked: { type: array, items: { $ref: "#/components/schemas/Mention" } }
        unlinked: { type: array, items: { $ref: "#/components/schemas/Mention" } }
    GraphNode:
      type: object
      required: [key, hop, target]
      properties:
        key: { type: string }
        hop: { type: integer }
        target: { $ref: "#/components/schemas/LinkTarget" }
    Graph:
      type: object
      required: [nodes, edges]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }
    SearchHit:
      type: object
      required: [target, snippet, score]
      properties:
        target: { $ref: "#/components/schemas/LinkTarget" }
        snippet: { type: string, description: "Matches are wrapped in « »" }
        score: { type: number }
    WikiPattern:
      type: object
      required: [title, path, topic, tags, summary, snippet, score]
      properties:
        title: { type: string }
        path: { type: string }
        topic: { type: string }
        tags: { type: array, items: { type: string } }
        summary: { type: string, description: "First line of When to use" }
        snippet: { type: string, description: "Matches are wrapped in « »; empty when browsing" }
        score: { type: number }
    TagCount:
      type: object
      required: [tag, count]
      properties:
        tag: { type: string }
        count: { type: integer }
    WikiADR:
      type: object
      required: [id, title, href, status, state, open_questions, has_open_questions, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        path: { type: string, description: Wiki pages only }
        display_id: { type: string, description: "ADR documents only, e.g. ADR-012" }
        href: { type: string }
        status: { type: string, description: "From the \"Status: …\" line, without \"with open questions\" (see has_open_questions); empty when there's no Status line" }
        state:
          type: string
          enum: [accepted, proposed, superseded, deprecated, rejected, other, none]
        date: { type: string, description: "YYYY-MM-DD from the Status line" }
        ticket: { type: string, description: "Ticket key from the Status line (Ticket: [[KEY]])" }
        open_questions: { type: array, items: { type: string }, description: "Items of the \"Open questions\" section, as Markdown" }
        has_open_questions: { type: boolean, description: "Open questions are listed, or the Status line says \"with open questions\"" }
        updated_at: { type: string, format: date-time }
    WikiCitation:
      type: object
      required: [run_id, purpose, agent, reads, last_read_at]
      properties:
        run_id: { type: string, format: uuid }
        purpose: { type: string, enum: [ticket, planning, chat] }
        agent: { $ref: "#/components/schemas/AgentRef" }
        ticket_key: { type: string }
        ticket_title: { type: string }
        chat_id: { type: string, format: uuid, description: "Only for the caller's own chats" }
        chat_title: { type: string }
        reads: { type: integer }
        last_read_at: { type: string, format: date-time }
    WikiCitations:
      type: object
      required: [runs, chats, citations, unlinked]
      properties:
        runs: { type: integer, description: Distinct non-chat runs }
        chats: { type: integer, description: "Distinct chats (another person's chat counts once per run)" }
        citations: { type: array, items: { $ref: "#/components/schemas/WikiCitation" } }
        unlinked:
          type: array
          description: Reads not tied to a run that still exists (older data), per agent
          items: { $ref: "#/components/schemas/ArtifactReader" }
    WikiPageSummary:
      type: object
      required: [id, path, title, author, updated_at, published, suggestions]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        title: { type: string }
        author: { $ref: "#/components/schemas/Actor" }
        project_id: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
