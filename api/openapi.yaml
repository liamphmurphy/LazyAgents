      properties:
        status: { type: string, enum: [ready, failed, unconfigured] }
        manifest: { type: string }
        tools: { type: array, items: { $ref: "#/components/schemas/EnvironmentTool" } }
        caches: { type: array, items: { $ref: "#/components/schemas/EnvironmentCache" } }
        packages: { type: array, items: { $ref: "#/components/schemas/EnvironmentPackage" } }
        go_modules: { type: array, items: { type: string } }
        npm_projects: { type: array, items: { type: string } }
        playwright: { type: array, items: { type: string } }
        error: { type: string }
    EnvironmentSnapshot:
      type: object
      required: [run_id, runner_id, backend, recorded_at, ticket_key, project_key, project_name, report]
      properties:
        run_id: { type: string, format: uuid }
        runner_id: { type: string }
        backend: { type: string }
        recorded_at: { type: string, format: date-time }
        ticket_key: { type: string }
        project_key: { type: string }
        project_name: { type: string }
        report: { $ref: "#/components/schemas/EnvironmentReport" }
    RunnerEnvironment:
      type: object
