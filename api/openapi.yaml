        title: { type: string }
        status: { $ref: "#/components/schemas/TicketStatus" }
        priority: { $ref: "#/components/schemas/Priority" }

    AgentWork:
      type: object
      required: [run_id, ticket, state, harness, model, started_at, step, step_position, steps_done, steps_total]
      properties:
        run_id: { type: string, format: uuid }
        ticket: { $ref: "#/components/schemas/WorkTicket" }
        state: { type: string }
        harness: { type: string }
        model: { type: string }
        started_at: { type: string, format: date-time }
        step: { type: string }
        step_position: { type: integer }
        steps_done: { type: integer }
        steps_total: { type: integer }

    PlanningWork:
      type: object
      required: [id, run_id, goal, state, harness, model]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        goal: { type: string }
        state: { type: string }
        harness: { type: string }
        model: { type: string }

    AgentScopeSummary:
      type: object
      required: [scope, mode, enforcement, how]
      properties:
        scope: { type: string }
        mode: { $ref: "#/components/schemas/ScopeMode" }
        enforcement: { type: string, enum: [credential, brokered, harness, none] }
        how: { type: string }

    AgentOverview:
      type: object
      required: [agent, max_concurrency, harness, planning_runs, assignments, queue, queue_count, stats, scopes]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        max_concurrency: { type: integer }
        harness: { type: string }
        planning_runs: { type: array, items: { $ref: "#/components/schemas/PlanningWork" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/AgentWork" } }
        queue: { type: array, items: { $ref: "#/components/schemas/WorkTicket" } }
        queue_count: { type: integer }
        stats: { $ref: "#/components/schemas/PerformanceStats" }
        scopes: { type: array, items: { $ref: "#/components/schemas/AgentScopeSummary" } }

    DelegationEfficiency:
      type: object
      required: [agent_id, handle, name, delegations, checked, first_pass, first_pass_rate, repair_loops, child_cost_usd_micros, parent_cost_usd_micros, total_cost_usd_micros, avg_seconds, avg_setup_seconds, avg_harness_seconds, avg_checks_seconds]
      properties:
        agent_id: { type: string, format: uuid }
        handle: { type: string }
        name: { type: string }
        delegations: { type: integer, description: "Finished delegated runs" }
        checked: { type: integer, description: "Delegated runs the runner checked (older runs were never checked)" }
        first_pass: { type: integer, description: "Runs whose result passed the runner's checks and needed no repeat delegation to the same agent" }
        first_pass_rate: { type: number, format: double, description: "first_pass / checked, 0 to 1; 0 when nothing was checked" }
        repair_loops: { type: integer, description: "Runs followed by another delegation to the same agent under the same parent run" }
        child_cost_usd_micros: { type: integer, format: int64 }
        parent_cost_usd_micros: { type: integer, format: int64, description: "Main-agent run cost attributed to this agent: each parent run's cost is split evenly by count across its child runs, and this sums the shares of this agent's children" }
        total_cost_usd_micros: { type: integer, format: int64 }
        avg_seconds: { type: number, format: double, description: "Mean elapsed time of a delegated run" }
        avg_setup_seconds: { type: number, format: double, description: "Mean setup time over delegated runs that have timings" }
        avg_harness_seconds: { type: number, format: double, description: "Mean harness time over delegated runs that have timings" }
        avg_checks_seconds: { type: number, format: double, description: "Mean checks time over delegated runs that have timings" }

    DelegationEfficiencyList:
      type: object
      required: [agents]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/DelegationEfficiency" } }

    AgentOverviewList:
      type: object
      required: [agents, stats_as_of]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/AgentOverview" } }
        stats_as_of: { type: string, format: date-time }

    ProjectOverview:
      type: object
      required: [project, counts, agents, updated_at]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        counts: { $ref: "#/components/schemas/WorkflowCounts" }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentRef" } }
        updated_at: { type: string, format: date-time }

    OverviewArtifact:
      type: object
      required: [id, title, type, href, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { $ref: "#/components/schemas/ArtifactType" }
        href: { type: string }
        updated_at: { type: string, format: date-time }

    EpicOverview:
      type: object
      required: [epic, project, objective, counts, agents, agent_seconds, tickets]
      properties:
        epic: { $ref: "#/components/schemas/Epic" }
        project: { $ref: "#/components/schemas/Project" }
        objective: { type: string }
        owner: { $ref: "#/components/schemas/UserRef" }
        source: { $ref: "#/components/schemas/OverviewArtifact" }
        start_date: { type: string, format: date }
        target_date: { type: string, format: date }
        counts: { $ref: "#/components/schemas/WorkflowCounts" }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentRef" } }
        agent_seconds: { type: number, format: double }
        tickets: { type: array, items: { $ref: "#/components/schemas/WorkTicket" } }

    EpicOverviewList:
      type: object
      required: [epics]
      properties:
        epics: { type: array, items: { $ref: "#/components/schemas/EpicOverview" } }

    Dashboard:
      type: object
      required: [stats, counts, review_over_day, agents, projects, attention, recent_artifacts, runner]
      properties:
        stats: { $ref: "#/components/schemas/RangeStats" }
        counts: { $ref: "#/components/schemas/WorkflowCounts" }
        review_over_day: { type: integer }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentOverview" } }
        projects: { type: array, items: { $ref: "#/components/schemas/ProjectOverview" } }
        attention: { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
        recent_artifacts: { type: array, items: { $ref: "#/components/schemas/OverviewArtifact" } }
        runner: { $ref: "#/components/schemas/RunnerStatus" }
        weekly_spend: { $ref: "#/components/schemas/WeeklySpend" }

    WeeklySpend:
      type: object
      description: Reported cost of runs started since Monday 00:00 UTC
      required: [since, cost_usd, runs, unpriced_runs]
      properties:
        since: { type: string, format: date-time, description: "Start of the week: Monday 00:00 UTC" }
        cost_usd: { type: number, format: double }
        runs: { type: integer, description: Runs started this week }
        unpriced_runs: { type: integer, description: "Runs whose cost is unknown or partial, so cost_usd may be low" }

    AgentRunSummary:
      type: object
      required: [id, ticket, state, harness, model, started_at, cost_usd, tool_calls, tokens]
      properties:
        id: { type: string, format: uuid }
        ticket: { $ref: "#/components/schemas/WorkTicket" }
        state: { type: string }
        harness: { type: string }
        model: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        cached_input_tokens: { type: integer, format: int64, description: Input served from cache where the provider reported cache usage }
        uncached_input_tokens: { type: integer, format: int64, description: Reported input not served from cache }
        unreported_input_tokens: { type: integer, format: int64, description: Input whose cache breakdown was not reported }
        cost_usd: { type: number, format: double }
        cost_source: { type: string }
        tool_calls: { type: integer }
        tokens: { type: integer, format: int64 }

    TicketProposal:
      type: object
      required: [title, description, criteria]
      properties:
        ref: { type: string, description: Stable unique proposal reference }
        depends_on: { type: array, items: { type: string }, description: References to other proposals }
        blocked_by: { type: array, items: { type: string }, description: Existing blocker ticket keys }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string }
        criteria:
          type: array
          items: { type: string }
        agent_id: { type: string, format: uuid }
        requires_mockup: { type: boolean, description: "The ticket changes UI: a person must approve a mockup before implementation" }
        estimate_points: { $ref: "#/components/schemas/EstimatePoints" }
        estimate_rationale: { type: string, maxLength: 2000 }
        planner_estimate:
          type: object
          readOnly: true
          description: Original planner estimate, preserved across reviewer saves.
          properties:
            points: { $ref: "#/components/schemas/EstimatePoints" }
            rationale: { type: string }
    PlanningInput:
      type: object
      required: [project, agent_id, goal]
      properties:
        project: { type: string }
        agent_id: { type: string, format: uuid }
        goal: { type: string, maxLength: 20000 }
        epic_id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        context_refs:
          type: array
          maxItems: 20
          description: Wiki pages, sections, artifacts and tickets in the project for the planner to read; delivered as context files when the run starts.
          items: { $ref: "#/components/schemas/ChatContextRef" }
    PlanningSession:
      type: object
      required: [id, project, goal, run_id, run_state, state, revision, proposals, proposal_count, context_refs, ticket_keys, ready_keys, created_at, updated_at, harness, model]
      properties:
        id: { type: string, format: uuid }
        project: { type: string }
        epic_id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        source_version_id: { type: string, format: uuid }
        goal: { type: string }
        run_id: { type: string, format: uuid }
        run_state: { type: string }
        outcome: { type: string }
        harness: { type: string }
        model: { type: string }
        state: { type: string, enum: [planning, review, accepted, dismissed] }
        revision: { type: integer }
        proposals:
          type: array
          items: { $ref: '#/components/schemas/TicketProposal' }
        proposal_count: { type: integer, description: How many proposals the planner submitted (0 until it does); ticket_keys counts the accepted ones }
        context_refs: { type: array, items: { $ref: "#/components/schemas/ChatContextRef" }, description: What the person attached when starting the plan }
        ready_keys: { type: array, items: { type: string }, description: Created tickets currently ready for manual dispatch }
        ticket_keys:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NewProject:
      type: object
      required: [key, name, color, repo_url, default_branch]
      properties:
        key: { type: string }
        name: { type: string }
        color: { type: string }
        repo_url: { type: string, description: "GitHub URL: git@github.com:owner/repo[.git], ssh://git@github.com/owner/repo[.git], or https://github.com/owner/repo[.git] (stored in SSH form). Legacy HTTPS values are kept until changed." }
        default_branch: { type: string }
    ProjectUpdate:
      type: object
      required: [name, color, repo_url, default_branch, archived, revision]
      properties:
        name: { type: string }
        color: { type: string }
        repo_url: { type: string, description: "GitHub URL: git@github.com:owner/repo[.git], ssh://git@github.com/owner/repo[.git], or https://github.com/owner/repo[.git] (stored in SSH form). Legacy HTTPS values are kept until changed." }
        default_branch: { type: string }
        archived: { type: boolean }
        revision: { type: integer }
    TicketDependency:
      type: object
      required: [id, key, title, status]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
    ChatState:
      type: string
      enum: [idle, running, failed]
      description: "idle: waiting for the person; running: a turn is queued or executing; failed: the last turn failed (posting again retries)"
    ChatContextRef:
      type: object
      required: [kind]
      description: Something attached to a message for the assistant to read. Exactly one of id or key; must belong to the chat's project (notes may be workspace-wide).
      properties:
        kind: { type: string, enum: [artifact, section, ticket, page] }
        id: { type: string, format: uuid, description: Artifact or wiki page id }
        key: { type: string, description: Ticket key, e.g. PAY-214 }
        anchor: { type: string, description: Section anchor when kind is section }
    ChatCitation:
      type: object
      required: [target]
      description: Something the assistant read while answering (from read_artifact / read_page / get_ticket)
      properties:
        target: { $ref: "#/components/schemas/LinkTarget" }
        artifact_id: { type: string, format: uuid, description: The artifact (or wiki page) that was read }
        title: { type: string }
        path: { type: string, description: Wiki path, for pages }
        version_id: { type: string, format: uuid, description: The exact version that was read }
        version: { type: string, description: "Version label, e.g. v3" }
        section: { type: string, description: Section anchor, when only one section was read }
    ChatSession:
      type: object
      required: [id, project, title, agent, harness, model, state, archived, revision, message_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project: { type: string, description: Project key }
        title: { type: string, description: "Defaults to the start of the first message" }
        agent: { $ref: "#/components/schemas/AgentRef" }
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string, description: The model the next turn uses }
        state: { $ref: "#/components/schemas/ChatState" }
        error: { type: string, description: Why the last turn failed, when state is failed }
        current_run_id: { type: string, format: uuid, description: The run serving the current harness segment; its events show live activity }
        archived: { type: boolean }
        revision: { type: integer }
        message_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_message_at: { type: string, format: date-time }
    NewChat:
      type: object
      required: [project]
      properties:
        project: { type: string, description: Project key }
        title: { type: string, maxLength: 200 }
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string, description: Defaults to the harness's default model in GET /chat-models }
        message: { $ref: "#/components/schemas/NewChatMessage" }
    ChatPatch:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
        title: { type: string, minLength: 1, maxLength: 200 }
        archived: { type: boolean }
    NewChatMessage:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 100000 }
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        context_refs:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ChatContextRef" }
    ChatMessage:
      type: object
      required: [id, seq, role, body_md, created_at]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, description: "1-based, monotonic per chat" }
        role: { type: string, enum: [user, assistant, system], description: "system: switches, handoffs, cancels and errors, shown inline" }
        body_md: { type: string }
        harness: { $ref: "#/components/schemas/Harness" }
        model: { type: string }
        run_id: { type: string, format: uuid }
        turn_seq: { type: integer, description: The run turn that produced an assistant message }
        context_refs: { type: array, items: { $ref: "#/components/schemas/ChatContextRef" } }
        citations: { type: array, items: { $ref: "#/components/schemas/ChatCitation" } }
        author: { $ref: "#/components/schemas/UserRef" }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cached_input_tokens: { type: integer, format: int64, description: Input served from cache where the provider reported cache usage }
        uncached_input_tokens: { type: integer, format: int64, description: Reported input not served from cache }
        unreported_input_tokens: { type: integer, format: int64, description: Input whose cache breakdown was not reported }
        cost_usd: { type: number }
        created_at: { type: string, format: date-time }
    ChatModel:
      type: object
      required: [id, label, default]
      properties:
        id: { type: string, description: "Value for the model field, e.g. opus-5.5 or gpt-5-codex" }
        label: { type: string }
        default: { type: boolean, description: The harness's default model }
    ChatHarnessModels:
      type: object
      required: [harness, label, available, models]
      properties:
        harness: { $ref: "#/components/schemas/Harness" }
        label: { type: string }
        available: { type: boolean }
        unavailable_reason: { type: string, description: "e.g. no harness:openai secret" }
        models: { type: array, items: { $ref: "#/components/schemas/ChatModel" } }
