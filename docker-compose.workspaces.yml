# Opt-in: keep run checkouts in a folder on this machine so you can open the
# code in your own editor while an agent works. See docs/guide.md, "Open a
# run's code". Set VESPER_WORKSPACES_DIR in .env to an absolute path, then:
#   full stack: add COMPOSE_FILE=docker-compose.yml:docker-compose.workspaces.yml to .env
#   make start / make runner: picks this file up when VESPER_WORKSPACES_DIR is set
# and turn it on in Settings → Runner backends → Host folders.
services:
  runner:
    environment:
      RUNNER_HOST_WORKSPACES_DIR: ${VESPER_WORKSPACES_DIR:?set VESPER_WORKSPACES_DIR to an absolute path}
    volumes:
      # The same path inside the runner as on the host: the runner creates and
      # removes run folders here, and hands the path to Docker as the source
      # of each turn's /workspace bind mount.
      - ${VESPER_WORKSPACES_DIR}:${VESPER_WORKSPACES_DIR}
