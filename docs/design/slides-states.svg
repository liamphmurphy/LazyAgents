<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-label="Slides: empty, loading, error, saving, conflict, overflow, keyboard focus and narrow viewport states"><title>Slides: empty, loading, error, saving, conflict, overflow, keyboard focus and narrow viewport states</title><rect width="1800" height="1000" fill="#07060B"/><defs><clipPath id="screen"><rect width="1440" height="1000"/></clipPath><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F5A9F"/><stop offset="1" stop-color="#559FA0"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/></filter></defs><g clip-path="url(#screen)"><rect width="1440" height="1000" fill="#0C0B12"/><rect width="1440" height="1000" fill="#0C0B12"/><text x="32" y="44" font-size="22" font-weight="600" fill="#EEEDF3">Slides · states</text><text x="32" y="68" font-size="13" fill="#A4A1B3">Every state reuses the Docs patterns: Banner, Skeleton, the save-state label, role=alert and role=status.</text><text x="32" y="108" font-size="12" font-weight="600" fill="#F2A97E">Save state (top bar)</text><rect x="32" y="120" width="300" height="28" rx="7" fill="#15141F" stroke="#24222F"/><text x="44" y="139" font-size="12" fill="#8C899C">Saved · v14</text><rect x="32" y="154" width="300" height="28" rx="7" fill="#15141F" stroke="#24222F"/><text x="44" y="173" font-size="12" fill="#8C899C">Unsaved changes · v14</text><rect x="32" y="188" width="300" height="28" rx="7" fill="#15141F" stroke="#24222F"/><text x="44" y="207" font-size="12" fill="#8C899C">Saving… · v14</text><rect x="32" y="222" width="300" height="28" rx="7" fill="#15141F" stroke="#24222F"/><text x="44" y="241" font-size="12" fill="#F49390">Not saved · v14</text><text x="192" y="241" font-size="11.5" fill="#8C899C">← hover: why, and Retry</text><text x="32" y="288" font-size="12" font-weight="600" fill="#F2A97E">Conflict (409, overlapping changes)</text><rect x="32" y="300" width="640" height="78" rx="12" fill="#EF6461" fill-opacity="0.06" stroke="#EF6461" stroke-opacity="0.25"/><text x="48" y="326" font-size="13" font-weight="600" fill="#F49390">This deck changed while you were editing</text><text x="48" y="346" font-size="12.5" fill="#A4A1B3">Ada changed slide 2's body text, which you also edited. Your other changes were merged.</text><g transform="translate(48,350)"><rect width="75" height="26" rx="7" fill="none" stroke="#2E2B3B"/><text x="13" y="17.5" font-size="13" font-weight="500" fill="#CBC9D6">Compare</text></g><g transform="translate(131,350)"><rect width="180" height="26" rx="7" fill="#1E1E24" stroke="#3A3A44"/><text x="13" y="17.5" font-size="13" font-weight="500" fill="#EEEDF3">Use the latest version</text></g><g transform="translate(319,350)"><rect width="89" height="26" rx="7" fill="#9B8CFF"/><text x="13" y="17.5" font-size="13" font-weight="600" fill="#120F24">Keep mine</text></g><text x="32" y="408" font-size="12" font-weight="600" fill="#F2A97E">Persona editing (read-only)</text><rect x="32" y="420" width="640" height="40" rx="10" fill="#15141F" stroke="#24222F"/><circle cx="52" cy="440" r="9" fill="#2B2366" opacity="0.6"/><text x="52" y="444" font-size="10" font-weight="700" fill="#C9BEFF" text-anchor="middle">A</text><text x="70" y="445" font-size="12.5" fill="#A4A1B3">Ada is editing… The canvas is read-only until she finishes. Stop</text><text x="32" y="492" font-size="12" font-weight="600" fill="#F2A97E">Save failed (network or 5xx)</text><rect x="32" y="504" width="640" height="78" rx="12" fill="#EF6461" fill-opacity="0.06" stroke="#EF6461" stroke-opacity="0.25"/><text x="48" y="530" font-size="13" font-weight="600" fill="#F49390">Couldn’t save your changes</text><text x="48" y="550" font-size="12.5" fill="#A4A1B3">Vesper will keep retrying. Your edits are kept in this tab; don't close it yet.</text><g transform="translate(48,554)"><rect width="89" height="26" rx="7" fill="#1E1E24" stroke="#3A3A44"/><text x="13" y="17.5" font-size="13" font-weight="500" fill="#EEEDF3">Retry now</text></g><text x="32" y="612" font-size="12" font-weight="600" fill="#F2A97E">Open failed / not found</text><rect x="32" y="624" width="640" height="78" rx="12" fill="#EF6461" fill-opacity="0.06" stroke="#EF6461" stroke-opacity="0.25"/><text x="48" y="650" font-size="13" font-weight="600" fill="#F49390">Couldn’t open this deck</text><text x="48" y="670" font-size="12.5" fill="#A4A1B3">It may have been deleted, or it belongs to someone else.</text><g transform="translate(48,674)"><rect width="124" height="26" rx="7" fill="#1E1E24" stroke="#3A3A44"/><text x="13" y="17.5" font-size="13" font-weight="500" fill="#EEEDF3">Back to Slides</text></g><text x="32" y="732" font-size="12" font-weight="600" fill="#F2A97E">Loading the editor</text><rect x="32" y="744" width="640" height="220" rx="12" fill="#15141F" stroke="#24222F" aria-busy="true"/><rect x="48" y="760" width="96" height="40" rx="4" fill="#1F1D2B"/><rect x="48" y="808" width="96" height="40" rx="4" fill="#1F1D2B"/><rect x="48" y="856" width="96" height="40" rx="4" fill="#1F1D2B"/><rect x="48" y="904" width="96" height="40" rx="4" fill="#1F1D2B"/><rect x="160" y="760" width="300" height="14" rx="4" fill="#1F1D2B"/><rect x="160" y="786" width="496" height="162" rx="6" fill="#1F1D2B"/><text x="712" y="108" font-size="12" font-weight="600" fill="#F2A97E">Text overflow (editor)</text><rect x="712" y="120" width="330" height="190" rx="4" fill="#FFFFFF" stroke="#24222F"/><text x="732" y="160" font-family="Arial" font-size="15" fill="#1F2328">This box is too small for the</text><text x="732" y="182" font-family="Arial" font-size="15" fill="#1F2328">amount of text that has been</text><text x="732" y="204" font-family="Arial" font-size="15" fill="#9CA3AF">typed into it, so the layout</text><text x="732" y="226" font-family="Arial" font-size="15" fill="#9CA3AF">reports an overflow.</text><rect x="724" y="136" width="300" height="52" fill="none" stroke="#F59E5B" stroke-width="2" stroke-dasharray="6 4"/><rect x="724" y="238" width="168" height="20" rx="5" fill="#F59E5B"/><text x="732" y="252" font-size="11.5" font-weight="600" fill="#1A1206">Text doesn't fit · 2 lines</text><text x="724" y="276" font-size="11.5" fill="#6B7280">Lines past the box are dimmed while editing.</text><text x="724" y="294" font-size="11.5" fill="#6B7280">The thumbnail gets an amber “!”.</text><text x="1062" y="108" font-size="12" font-weight="600" fill="#F2A97E">Image upload</text><rect x="1062" y="120" width="340" height="84" rx="10" fill="#110F19" stroke="#2E2B3B" stroke-dasharray="4 3"/><text x="1232" y="156" font-size="13" fill="#A4A1B3" text-anchor="middle">Drop an image, paste, or browse</text><text x="1232" y="178" font-size="11.5" fill="#8C899C" text-anchor="middle">PNG or JPEG, up to 10 MB</text><rect x="1062" y="214" width="340" height="34" rx="8" fill="#15141F" stroke="#24222F"/><rect x="1072" y="228" width="200" height="6" rx="3" fill="#9B8CFF"/><text x="1392" y="236" font-size="11.5" fill="#8C899C" text-anchor="end">Uploading… 62%</text><rect x="1062" y="256" width="340" height="50" rx="8" fill="#EF6461" fill-opacity="0.06" stroke="#EF6461" stroke-opacity="0.25"/><text x="1074" y="276" font-size="12" fill="#F49390">photo.heic is 14 MB: the limit is 10 MB.</text><text x="1074" y="294" font-size="11.5" fill="#A4A1B3">Missing image on a slide shows a grey “image unavailable” tile.</text><text x="712" y="342" font-size="12" font-weight="600" fill="#F2A97E">Keyboard and focus</text><rect x="712" y="354" width="690" height="150" rx="12" fill="#15141F" stroke="#24222F"/><g transform="translate(728,370) scale(0.0583)"><rect width="1920" height="1080" fill="#FFFFFF"/><text x="136" y="200" font-family="Arial" font-size="80" font-weight="700" fill="#111418">What changed this quarter</text><text x="136" y="340" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="340" font-family="Arial" font-size="48" fill="#1F2328">Revenue grew 18% against a plan of 12%, driven by…</text><text x="196" y="400" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="256" y="400" font-family="Arial" font-size="40" fill="#1F2328">Churn held steady; expansion did the work.</text><text x="136" y="460" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="460" font-family="Arial" font-size="48" fill="#1F2328">This is a deliberately long bullet so the shared</text><text x="196" y="518" font-family="Arial" font-size="48" fill="#1F2328">layout has to wrap it across more than one line</text><text x="136" y="640" font-family="Arial" font-size="48" fill="#1F2328">1.</text><text x="196" y="640" font-family="Arial" font-size="48" fill="#1F2328">Underlined and coloured runs survive export.</text></g><rect x="728" y="370" width="112" height="63" rx="4" fill="none" stroke="#9B8CFF" stroke-width="2"/><rect x="725" y="367" width="118" height="69" rx="6" fill="none" stroke="#9B8CFF" stroke-opacity="0.35" stroke-width="2"/><text x="728" y="456" font-size="11.5" fill="#8C899C">Focused thumbnail</text><rect x="862" y="370" width="180" height="64" rx="2" fill="#FFFFFF"/><rect x="874" y="382" width="156" height="40" fill="none" stroke="#9B8CFF" stroke-width="1.5"/><rect x="870" y="378" width="8" height="8" rx="1.5" fill="#FFFFFF" stroke="#9B8CFF"/><rect x="1026" y="418" width="8" height="8" rx="1.5" fill="#FFFFFF" stroke="#9B8CFF"/><text x="862" y="456" font-size="11.5" fill="#8C899C">Selected element (Tab cycles)</text><rect x="1062" y="376" width="30" height="30" rx="7" fill="#201E2C" stroke="#9B8CFF"/><text x="1077" y="396" font-size="13" font-weight="600" fill="#EEEDF3" text-anchor="middle">B</text><rect x="1059" y="373" width="36" height="36" rx="9" fill="none" stroke="#9B8CFF" stroke-opacity="0.5" stroke-width="2"/><text x="1104" y="396" font-size="11.5" fill="#8C899C">Toolbar: roving tabindex, ← → inside groups</text><text x="728" y="482" font-size="11.5" fill="#A4A1B3">Shortcuts: ⌘Z ⇧⌘Z undo/redo · ⌘D duplicate · ⌫ delete · ⌘↵ present · Alt+↑/↓ move slide · Enter edit text · Esc leave/deselect · ? help</text><text x="712" y="540" font-size="12" font-weight="600" fill="#F2A97E">Narrow viewport (390 × 844, editor)</text><rect x="712" y="552" width="300" height="420" rx="18" fill="#0C0B12" stroke="#2E2B3B"/><rect x="712" y="552" width="300" height="44" rx="18" fill="#0C0B12"/><line x1="712" y1="596" x2="1012" y2="596" stroke="#1E1C29"/><text x="726" y="579" font-size="12.5" font-weight="500" fill="#EEEDF3">‹  Quarterly review</text><text x="998" y="579" font-size="11" fill="#8C899C" text-anchor="end">Saved · v14   ⋯</text><g transform="translate(722,608) scale(0.1458)"><rect width="1920" height="1080" fill="#FFFFFF"/><text x="136" y="200" font-family="Arial" font-size="80" font-weight="700" fill="#111418">What changed this quarter</text><text x="136" y="340" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="340" font-family="Arial" font-size="48" fill="#1F2328">Revenue grew 18% against a plan of 12%, driven by…</text><text x="196" y="400" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="256" y="400" font-family="Arial" font-size="40" fill="#1F2328">Churn held steady; expansion did the work.</text><text x="136" y="460" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="460" font-family="Arial" font-size="48" fill="#1F2328">This is a deliberately long bullet so the shared</text><text x="196" y="518" font-family="Arial" font-size="48" fill="#1F2328">layout has to wrap it across more than one line</text><text x="136" y="640" font-family="Arial" font-size="48" fill="#1F2328">1.</text><text x="196" y="640" font-family="Arial" font-size="48" fill="#1F2328">Underlined and coloured runs survive export.</text></g><rect x="722" y="608" width="280" height="157.5" rx="4" fill="none" stroke="#24222F"/><g transform="translate(722,775.5) scale(0.0333)"><rect width="1920" height="1080" fill="#F3F5F9"/><rect x="160" y="320" width="200" height="12" fill="#3B6FE0"/><text x="176" y="540" font-family="Arial" font-size="112" font-weight="700" fill="#111418">Quarterly review</text><text x="176" y="660" font-family="Arial" font-size="44" fill="#6B7280">Slides acceptance deck · v1 schema</text></g><rect x="722" y="775.5" width="64" height="36" rx="4" fill="none" stroke="#24222F"/><g transform="translate(794,775.5) scale(0.0333)"><rect width="1920" height="1080" fill="#FFFFFF"/><text x="136" y="200" font-family="Arial" font-size="80" font-weight="700" fill="#111418">What changed this quarter</text><text x="136" y="340" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="340" font-family="Arial" font-size="48" fill="#1F2328">Revenue grew 18% against a plan of 12%, driven by…</text><text x="196" y="400" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="256" y="400" font-family="Arial" font-size="40" fill="#1F2328">Churn held steady; expansion did the work.</text><text x="136" y="460" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="460" font-family="Arial" font-size="48" fill="#1F2328">This is a deliberately long bullet so the shared</text><text x="196" y="518" font-family="Arial" font-size="48" fill="#1F2328">layout has to wrap it across more than one line</text><text x="136" y="640" font-family="Arial" font-size="48" fill="#1F2328">1.</text><text x="196" y="640" font-family="Arial" font-size="48" fill="#1F2328">Underlined and coloured runs survive export.</text></g><rect x="794" y="775.5" width="64" height="36" rx="4" fill="none" stroke="#9B8CFF" stroke-width="2"/><g transform="translate(866,775.5) scale(0.0333)"><rect width="1920" height="1080" fill="#FFFFFF"/><text x="136" y="230" font-family="Arial" font-size="72" font-weight="700" fill="#111418">Images are cropped,</text><text x="136" y="318" font-family="Arial" font-size="72" font-weight="700" fill="#111418">not squashed</text><text x="136" y="520" font-family="Arial" font-size="40" fill="#1F2328">The photo is 3:2; its frame is nearly square.</text><text x="136" y="568" font-family="Arial" font-size="40" fill="#1F2328">A crop rectangle in source fractions keeps</text><text x="136" y="616" font-family="Arial" font-size="40" fill="#1F2328">the sun and trims the red border on the left.</text><rect x="1000" y="120" width="800" height="840" fill="url(#sky)"/><circle cx="1590" cy="350" r="150" fill="#F9C752"/><polygon points="1000,950 1030,620 1260,960" fill="#2B4A3E"/><polygon points="1000,960 1440,435 1800,860 1800,960" fill="#3E6652"/></g><rect x="866" y="775.5" width="64" height="36" rx="4" fill="none" stroke="#24222F"/><g transform="translate(938,775.5) scale(0.0333)"><rect width="1920" height="1080" fill="#FFFFFF"/><rect x="120" y="160" width="520" height="300" rx="32" fill="#3B6FE0"/><text x="380" y="300" font-family="Arial" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">Editable text in a</text><text x="380" y="356" font-family="Arial" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">shape</text><ellipse cx="960" cy="310" rx="200" ry="150" fill="#E8A33D" stroke="#7C4A03" stroke-width="6"/><g transform="rotate(8 1540 310)"><rect x="1280" y="160" width="520" height="300" fill="#F3F5F9" stroke="#6B7280" stroke-width="4"/><text x="1300" y="220" font-family="Arial" font-size="40" fill="#1F2328">Rotated 8°</text></g><line x1="120" y1="600" x2="1780" y2="600" stroke="#111418" stroke-width="8"/><polygon points="1772,580 1800,600 1772,620" fill="#111418"/><text x="136" y="760" font-family="Arial" font-size="40" fill="#1F2328">This box is too small for the amount</text><text x="136" y="808" font-family="Arial" font-size="40" fill="#1F2328">of text that has been typed into it, so</text><text x="136" y="856" font-family="Arial" font-size="40" fill="#1F2328">the layout reports an overflow instead</text><text x="136" y="904" font-family="Arial" font-size="40" fill="#1F2328">of shrinking it.</text></g><rect x="938" y="775.5" width="64" height="36" rx="4" fill="none" stroke="#24222F"/><rect x="722" y="825.5" width="280" height="34" rx="8" fill="#15141F" stroke="#24222F"/><text x="734" y="847.5" font-size="13" fill="#CBC9D6">T   ◻   ▨   ▤   B  I  U   •≡   ⋯</text><rect x="722" y="920" width="280" height="40" rx="10" fill="#9B8CFF"/><text x="862" y="945" font-size="13" font-weight="600" fill="#120F24" text-anchor="middle">✦ Chat with Ada</text><text x="1028" y="572" font-size="12" font-weight="600" fill="#CBC9D6">Below 800px:</text><text x="1028" y="596" font-size="11.5" fill="#A4A1B3">• the sidebar collapses; the top bar keeps</text><text x="1028" y="616" font-size="11.5" fill="#A4A1B3">  title, save state and a ⋯ menu</text><text x="1028" y="636" font-size="11.5" fill="#A4A1B3">  (Present, Export, Rename, Duplicate)</text><text x="1028" y="656" font-size="11.5" fill="#A4A1B3">• thumbnails become a horizontal strip</text><text x="1028" y="676" font-size="11.5" fill="#A4A1B3">  under the slide (swipe; long-press to move)</text><text x="1028" y="696" font-size="11.5" fill="#A4A1B3">• the toolbar is one scrolling row; the</text><text x="1028" y="716" font-size="11.5" fill="#A4A1B3">  text group opens as a bottom sheet</text><text x="1028" y="736" font-size="11.5" fill="#A4A1B3">• the chat is a full-height drawer from the</text><text x="1028" y="756" font-size="11.5" fill="#A4A1B3">  Chat with Ada button, like Docs (max-lg)</text><text x="1028" y="776" font-size="11.5" fill="#A4A1B3">• the review shows before/after stacked</text><text x="1028" y="796" font-size="11.5" fill="#A4A1B3">• present: swipe, tap thirds, Exit stays visible</text></g></svg>