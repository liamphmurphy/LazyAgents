<rect x="1100" y="0" width="340" height="900" fill="#0D0D10"/><line x1="1100" y1="0" x2="1100" y2="900" stroke="#1C1C21"/>
<rect x="1118" y="15" width="22" height="22" rx="5" fill="#26262C"/><text x="1129" y="31" font-size="11" font-weight="600" text-anchor="middle" fill="#EDEDEF">T</text>
<text x="1150" y="31" font-size="13" font-weight="600" fill="#EDEDEF">Theo, your tutor</text>
<text x="1422" y="31" font-size="11" text-anchor="end" fill="#8B8B94">Not reviewed</text>
<line x1="1100" y1="52" x2="1440" y2="52" stroke="#1C1C21"/>

<rect x="1166" y="74" width="256" height="50" rx="8" fill="#16161B"/>
<g font-size="13" fill="#EDEDEF"><text x="1178" y="94">Why doesn't T130 just read the</text><text x="1178" y="113">newest committed version?</text></g>
<g font-size="13" fill="#C9C9CF"><text x="1118" y="154">What would happen to a long report if</text><text x="1118" y="174">rows changed under it halfway through?</text><text x="1118" y="202">Try answering that, then look at the xmax</text><text x="1118" y="222">column in the figure.</text></g>
<rect x="1212" y="242" width="210" height="34" rx="8" fill="#16161B"/>
<text x="1224" y="264" font-size="13" fill="#EDEDEF">It'd mix old and new totals.</text>
<g font-size="13" fill="#C9C9CF"><text x="1118" y="306">Exactly. One consistent view of the data</text><text x="1118" y="326">is the point. So which version does that</text><text x="1118" y="346">snapshot have to keep using?</text></g>

<g font-size="12" fill="#A1A1AA" text-anchor="middle">
<rect x="1118" y="796" width="116" height="26" rx="13" fill="none" stroke="#26262C"/><text x="1176" y="813">Explain differently</text>
<rect x="1242" y="796" width="88" height="26" rx="13" fill="none" stroke="#26262C"/><text x="1286" y="813">An example</text>
<rect x="1338" y="796" width="62" height="26" rx="13" fill="none" stroke="#26262C"/><text x="1369" y="813">Quiz me</text>
</g>
<rect x="1118" y="832" width="304" height="44" rx="8" fill="#111114" stroke="#26262C"/><text x="1132" y="859" font-size="13" fill="#8B8B94">Ask about this lesson…</text>
</svg>
