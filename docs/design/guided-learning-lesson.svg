<g font-size="13" fill="#A1A1AA"><text x="98" y="182">Transactions and isolation</text><text x="98" y="212">Heap pages and tuples</text><text x="98" y="278">Row versions</text><text x="98" y="313" fill="#EDEDEF" font-weight="500">Snapshots</text><text x="98" y="344">Hint bits and visibility</text><text x="98" y="404">Dead tuples and bloat</text><text x="98" y="434">What VACUUM actually does</text><text x="98" y="474">Tuning autovacuum</text><text x="98" y="530">Transaction ID wraparound</text><text x="98" y="560">Freezing</text></g>
