<line x1="56" y1="52" x2="312" y2="52" stroke="#1C1C21"/>
<text x="74" y="82" font-size="14" font-weight="600" fill="#EDEDEF">Postgres MVCC and vacuum</text>
<text x="74" y="104" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#8B8B94">3 of 10 complete · 2 solid</text>
<rect x="74" y="116" width="220" height="4" rx="2" fill="#26262C"/><rect x="74" y="116" width="66" height="4" rx="2" fill="#C9C9CF"/>
<g font-size="11" font-weight="600" fill="#8B8B94"><text x="74" y="156">UNIT 1 · FOUNDATIONS</text><text x="74" y="252">UNIT 2 · VISIBILITY</text><text x="74" y="378">UNIT 3 · VACUUM</text><text x="74" y="504">UNIT 4 · WRAPAROUND</text></g>
<rect x="66" y="294" width="236" height="30" rx="6" fill="#1B1B21"/>
<g fill="#C9C9CF"><circle cx="82" cy="178" r="6"/><circle cx="82" cy="208" r="6"/><circle cx="82" cy="274" r="6"/></g>
