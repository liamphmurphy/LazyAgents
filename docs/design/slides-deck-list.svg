<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-label="Slides: deck list, new deck and list states"><title>Slides: deck list, new deck and list states</title><rect width="1800" height="900" fill="#07060B"/><defs><clipPath id="screen"><rect width="1440" height="900"/></clipPath><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F5A9F"/><stop offset="1" stop-color="#559FA0"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/></filter></defs><g clip-path="url(#screen)"><rect width="1440" height="900" fill="#0C0B12"/><rect width="232" height="900" fill="#100F18"/><line x1="232" y1="0" x2="232" y2="900" stroke="#1E1C29"/><rect x="12" y="14" width="22" height="22" rx="6" fill="#9B8CFF"/><text x="23" y="30" font-size="12" font-weight="700" fill="#120F24" text-anchor="middle">V</text><text x="44" y="30" font-size="13.5" font-weight="600" fill="#EEEDF3">Vesper</text><rect x="12" y="50" width="208" height="32" rx="7" fill="#15141F" stroke="#24222F"/><text x="24" y="70" font-size="12.5" fill="#8C899C">Search…</text><text x="206" y="70" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C899C" text-anchor="end">⌘K</text><rect x="22" y="94" width="14" height="14" rx="3" fill="none" stroke="#A4A1B3" stroke-width="1.5"/><text x="46" y="105" font-size="13" fill="#A4A1B3">Home</text><rect x="22" y="126" width="14" height="14" rx="3" fill="none" stroke="#A4A1B3" stroke-width="1.5"/><text x="46" y="137" font-size="13" fill="#A4A1B3">Chat</text><rect x="22" y="158" width="14" height="14" rx="3" fill="none" stroke="#A4A1B3" stroke-width="1.5"/><text x="46" y="169" font-size="13" fill="#A4A1B3">Inbox</text><rect x="22" y="190" width="14" height="14" rx="3" fill="none" stroke="#A4A1B3" stroke-width="1.5"/><text x="46" y="201" font-size="13" fill="#A4A1B3">Tickets</text><rect x="22" y="222" width="14" height="14" rx="3" fill="none" stroke="#A4A1B3" stroke-width="1.5"/><text x="46" y="233" font-size="13" fill="#A4A1B3">Epics</text><rect x="22" y="254" width="14" height="14" rx="3" fill="none" stroke="#A4A1B3" stroke-width="1.5"/><text x="46" y="265" font-size="13" fill="#A4A1B3">Agents</text><rect x="22" y="286" width="14" height="14" rx="3" fill="none" stroke="#A4A1B3" stroke-width="1.5"/><text x="46" y="297" font-size="13" fill="#A4A1B3">Library</text><rect x="10" y="309" width="212" height="30" rx="6" fill="#201E2C"/><rect x="22" y="318" width="14" height="14" rx="3" fill="none" stroke="#EEEDF3" stroke-width="1.5"/><text x="46" y="329" font-size="13" font-weight="500" fill="#EEEDF3">Apps</text><text x="22" y="374" font-size="12" font-weight="500" fill="#8C899C">Apps</text><text x="46" y="403" font-size="13" fill="#A4A1B3">Docs</text><rect x="10" y="413" width="212" height="30" rx="6" fill="#1A1925"/><text x="46" y="433" font-size="13" fill="#EEEDF3">Slides</text><text x="46" y="463" font-size="13" fill="#A4A1B3">Finance</text><line x1="0" y1="844" x2="232" y2="844" stroke="#1E1C29"/><circle cx="30" cy="872" r="12" fill="#2A2838"/><text x="30" y="876" font-size="9.5" font-weight="600" fill="#CBC9D6" text-anchor="middle">LM</text><text x="50" y="876" font-size="12.5" fill="#CBC9D6">Liam Murphy</text><rect x="232" y="0" width="1208" height="52" fill="#0C0B12"/><line x1="232" y1="52" x2="1440" y2="52" stroke="#1E1C29"/><text x="252" y="31" font-size="13" fill="#A4A1B3">Apps</text><text x="288.8" y="31" font-size="13" fill="#8C899C">/</text><text x="302.8" y="31" font-size="13" font-weight="500" fill="#EEEDF3">Slides</text><text x="346" y="104" font-size="26" font-weight="600" fill="#EEEDF3" letter-spacing="-0.5">Slides</text><text x="346" y="128" font-size="13" fill="#A4A1B3">Decks you build and present with a persona. Each deck keeps its own chat.</text><rect x="346" y="150" width="980" height="40" rx="12" fill="#15141F" stroke="#9B8CFF" stroke-width="1.5"/><text x="360" y="175" font-size="13.5" fill="#8C899C">Start a deck: give it a title, or describe it and Ada drafts the slides…</text><rect x="1070" y="156" width="140" height="28" rx="7" fill="#110F19" stroke="#2E2B3B"/><rect x="1078" y="163" width="22" height="14" rx="2" fill="#FFFFFF" stroke="#2E2B3B"/><text x="1108" y="175" font-size="12" fill="#CBC9D6">Theme: Light</text><text x="1198" y="175" font-size="11" fill="#8C899C">▾</text><rect x="1218" y="155" width="102" height="30" rx="7" fill="#9B8CFF"/><text x="1231" y="174.5" font-size="13" font-weight="600" fill="#120F24">+</text><text x="1247" y="174.5" font-size="13" font-weight="600" fill="#120F24">New deck</text><circle cx="1338" cy="170" r="10" fill="#F2A97E"/><text x="1338" y="174" font-size="11" font-weight="700" fill="#1A1206" text-anchor="middle">1</text><text x="346" y="226" font-size="12.5" font-weight="500" fill="#A4A1B3">Recent</text><text x="1326" y="226" font-size="12" fill="#8C899C" text-anchor="end">Sorted by last edited</text><rect x="346" y="240" width="316" height="246" rx="12" fill="#15141F" stroke="#24222F"/><g transform="translate(358,252) scale(0.1521)"><rect width="1920" height="1080" fill="#F3F5F9"/><rect x="160" y="320" width="200" height="12" fill="#3B6FE0"/><text x="176" y="540" font-family="Arial" font-size="112" font-weight="700" fill="#111418">Quarterly review</text><text x="176" y="660" font-family="Arial" font-size="44" fill="#6B7280">Slides acceptance deck · v1 schema</text></g><rect x="358" y="252" width="292" height="164.2" rx="4" fill="none" stroke="#24222F"/><text x="360" y="442" font-size="13.5" font-weight="500" fill="#EEEDF3">Quarterly review</text><text x="360" y="462" font-size="12" fill="#8C899C">Edited 4 min ago · 5 slides</text><rect x="626" y="432" width="26" height="26" rx="6" fill="none"/><text x="639" y="450" font-size="14" font-weight="700" fill="#A4A1B3" text-anchor="middle">⋯</text><rect x="678" y="240" width="316" height="246" rx="12" fill="#15141F" stroke="#9B8CFF" stroke-width="2"/><rect x="675" y="237" width="322" height="252" rx="14" fill="none" stroke="#9B8CFF" stroke-opacity="0.35" stroke-width="2"/><g transform="translate(690,252) scale(0.1521)"><rect width="1920" height="1080" fill="#FFFFFF"/><text x="136" y="200" font-family="Arial" font-size="80" font-weight="700" fill="#111418">What changed this quarter</text><text x="136" y="340" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="340" font-family="Arial" font-size="48" fill="#1F2328">Revenue grew 18% against a plan of 12%, driven by…</text><text x="196" y="400" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="256" y="400" font-family="Arial" font-size="40" fill="#1F2328">Churn held steady; expansion did the work.</text><text x="136" y="460" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="460" font-family="Arial" font-size="48" fill="#1F2328">This is a deliberately long bullet so the shared</text><text x="196" y="518" font-family="Arial" font-size="48" fill="#1F2328">layout has to wrap it across more than one line</text><text x="136" y="640" font-family="Arial" font-size="48" fill="#1F2328">1.</text><text x="196" y="640" font-family="Arial" font-size="48" fill="#1F2328">Underlined and coloured runs survive export.</text></g><rect x="690" y="252" width="292" height="164.2" rx="4" fill="none" stroke="#24222F"/><text x="692" y="442" font-size="13.5" font-weight="500" fill="#EEEDF3">Board update: November</text><text x="692" y="462" font-size="12" fill="#8C899C">Edited yesterday · 12 slides</text><rect x="958" y="432" width="26" height="26" rx="6" fill="#1A1925"/><text x="971" y="450" font-size="14" font-weight="700" fill="#A4A1B3" text-anchor="middle">⋯</text><rect x="1010" y="240" width="316" height="246" rx="12" fill="#15141F" stroke="#24222F"/><g transform="translate(1022,252) scale(0.1521)"><rect width="1920" height="1080" fill="#FFFFFF"/><rect x="120" y="160" width="520" height="300" rx="32" fill="#3B6FE0"/><text x="380" y="300" font-family="Arial" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">Editable text in a</text><text x="380" y="356" font-family="Arial" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">shape</text><ellipse cx="960" cy="310" rx="200" ry="150" fill="#E8A33D" stroke="#7C4A03" stroke-width="6"/><g transform="rotate(8 1540 310)"><rect x="1280" y="160" width="520" height="300" fill="#F3F5F9" stroke="#6B7280" stroke-width="4"/><text x="1300" y="220" font-family="Arial" font-size="40" fill="#1F2328">Rotated 8°</text></g><line x1="120" y1="600" x2="1780" y2="600" stroke="#111418" stroke-width="8"/><polygon points="1772,580 1800,600 1772,620" fill="#111418"/><text x="136" y="760" font-family="Arial" font-size="40" fill="#1F2328">This box is too small for the amount</text><text x="136" y="808" font-family="Arial" font-size="40" fill="#1F2328">of text that has been typed into it, so</text><text x="136" y="856" font-family="Arial" font-size="40" fill="#1F2328">the layout reports an overflow instead</text><text x="136" y="904" font-family="Arial" font-size="40" fill="#1F2328">of shrinking it.</text></g><rect x="1022" y="252" width="292" height="164.2" rx="4" fill="none" stroke="#24222F"/><text x="1024" y="442" font-size="13.5" font-weight="500" fill="#EEEDF3">Hiring plan 2027</text><text x="1024" y="462" font-size="12" fill="#8C899C">Edited 3 days ago · 8 slides</text><rect x="1290" y="432" width="26" height="26" rx="6" fill="none"/><text x="1303" y="450" font-size="14" font-weight="700" fill="#A4A1B3" text-anchor="middle">⋯</text><rect x="346" y="502" width="316" height="246" rx="12" fill="#15141F" stroke="#24222F"/><g transform="translate(358,514) scale(0.1521)"><rect width="1920" height="1080" fill="#111418"/><text x="960" y="560" font-family="Arial" font-size="128" font-weight="700" fill="#FFFFFF" text-anchor="middle">Questions?</text><text x="960" y="640" font-family="Courier New" font-size="40" fill="#E8A33D" text-anchor="middle">mono: deck.schema = 1</text></g><rect x="358" y="514" width="292" height="164.2" rx="4" fill="none" stroke="#24222F"/><text x="360" y="704" font-size="13.5" font-weight="500" fill="#EEEDF3">Onboarding for new agents</text><text x="360" y="724" font-size="12" fill="#8C899C">Edited last week · 15 slides</text><rect x="626" y="694" width="26" height="26" rx="6" fill="none"/><text x="639" y="712" font-size="14" font-weight="700" fill="#A4A1B3" text-anchor="middle">⋯</text><rect x="678" y="502" width="316" height="246" rx="12" fill="#15141F" stroke="#24222F"/><rect x="690" y="514" width="292" height="164" rx="4" fill="#FFFFFF" stroke="#24222F"/><text x="836" y="600" font-size="13" fill="#9CA3AF" text-anchor="middle">Click to add a title</text><text x="692" y="704" font-size="13.5" font-weight="500" fill="#EEEDF3">Untitled deck</text><text x="692" y="724" font-size="12" fill="#8C899C">Edited 2 weeks ago · 1 slide</text><rect x="958" y="694" width="26" height="26" rx="6" fill="none"/><text x="971" y="712" font-size="14" font-weight="700" fill="#A4A1B3" text-anchor="middle">⋯</text><rect x="1010" y="502" width="316" height="246" rx="12" fill="#15141F" stroke="#24222F"/><g transform="translate(1022,514) scale(0.1521)"><rect width="1920" height="1080" fill="#FFFFFF"/><text x="136" y="230" font-family="Arial" font-size="72" font-weight="700" fill="#111418">Images are cropped,</text><text x="136" y="318" font-family="Arial" font-size="72" font-weight="700" fill="#111418">not squashed</text><text x="136" y="520" font-family="Arial" font-size="40" fill="#1F2328">The photo is 3:2; its frame is nearly square.</text><text x="136" y="568" font-family="Arial" font-size="40" fill="#1F2328">A crop rectangle in source fractions keeps</text><text x="136" y="616" font-family="Arial" font-size="40" fill="#1F2328">the sun and trims the red border on the left.</text><rect x="1000" y="120" width="800" height="840" fill="url(#sky)"/><circle cx="1590" cy="350" r="150" fill="#F9C752"/><polygon points="1000,950 1030,620 1260,960" fill="#2B4A3E"/><polygon points="1000,960 1440,435 1800,860 1800,960" fill="#3E6652"/></g><rect x="1022" y="514" width="292" height="164.2" rx="4" fill="none" stroke="#24222F"/><text x="1024" y="704" font-size="13.5" font-weight="500" fill="#EEEDF3">Design review</text><text x="1024" y="724" font-size="12" fill="#8C899C">Edited Oct 2 · 6 slides</text><rect x="1290" y="694" width="26" height="26" rx="6" fill="none"/><text x="1303" y="712" font-size="14" font-weight="700" fill="#A4A1B3" text-anchor="middle">⋯</text><g filter="url(#sh)"><rect x="874" y="462" width="176" height="150" rx="10" fill="#1B1A27" stroke="#2A2A31"/></g><text x="888" y="486" font-size="13" fill="#EEEDF3">Open</text><text x="888" y="514" font-size="13" fill="#EEEDF3">Rename</text><rect x="878" y="524" width="168" height="26" rx="6" fill="#1A1925"/><text x="888" y="542" font-size="13" fill="#EEEDF3">Duplicate</text><text x="888" y="570" font-size="13" fill="#EEEDF3">Present</text><text x="888" y="598" font-size="13" fill="#F49390">Delete…</text><circle cx="1064" cy="476" r="10" fill="#F2A97E"/><text x="1064" y="480" font-size="11" font-weight="700" fill="#1A1206" text-anchor="middle">2</text><line x1="232" y1="768" x2="1440" y2="768" stroke="#1E1C29"/><text x="346" y="786" font-size="12" font-weight="600" fill="#F2A97E">States</text><rect x="346" y="796" width="316" height="92" rx="12" fill="#15141F" stroke="#24222F"/><rect x="360" y="810" width="32" height="32" rx="8" fill="#201E2C" stroke="#2E2B3B"/><text x="376" y="831" font-size="14" font-weight="600" fill="#A4A1B3" text-anchor="middle">▭</text><text x="404" y="823" font-size="13" font-weight="600" fill="#EEEDF3">No decks yet</text><text x="404" y="841" font-size="12" fill="#A4A1B3">Start one above, or ask for a deck in</text><text x="404" y="857" font-size="12" fill="#A4A1B3">any chat: it shows up here too.</text><text x="360" y="878" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C899C">Empty</text><rect x="678" y="796" width="316" height="92" rx="12" fill="#15141F" stroke="#24222F" aria-busy="true"/><rect x="692" y="808" width="120" height="66" rx="4" fill="#1F1D2B"/><rect x="824" y="816" width="140" height="10" rx="4" fill="#1F1D2B"/><rect x="824" y="836" width="90" height="10" rx="4" fill="#1F1D2B"/><text x="824" y="878" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C899C">Loading: card skeletons</text><rect x="1010" y="796" width="316" height="92" rx="12" fill="#EF6461" fill-opacity="0.06" stroke="#EF6461" stroke-opacity="0.25"/><text x="1024" y="820" font-size="13" font-weight="600" fill="#F49390">Couldn’t load your decks</text><text x="1024" y="840" font-size="12" fill="#A4A1B3">The server didn’t answer (502). Your decks</text><text x="1024" y="856" font-size="12" fill="#A4A1B3">are safe.</text><rect x="1246" y="848" width="66" height="26" rx="7" fill="#1E1E24" stroke="#3A3A44"/><text x="1259" y="865.5" font-size="13" font-weight="500" fill="#EEEDF3">Retry</text><text x="1024" y="878" font-family="JetBrains Mono, monospace" font-size="11" fill="#8C899C">Error</text></g><rect x="1460" y="20" width="320" height="380" rx="10" fill="#1A1520" stroke="#F2A97E" stroke-opacity="0.35"/><text x="1472" y="38" font-size="11.5" font-weight="600" fill="#F2A97E">Design notes · deck list</text><circle cx="1480" cy="56" r="8" fill="#F2A97E"/><text x="1480" y="60" font-size="10" font-weight="700" fill="#1A1206" text-anchor="middle">1</text><text x="1494" y="60" font-size="11.5" fill="#CBC9D6">The title field mirrors Docs. Enter or New</text><text x="1494" y="78" font-size="11.5" fill="#CBC9D6">deck creates a deck with a title slide in</text><text x="1494" y="96" font-size="11.5" fill="#CBC9D6">the chosen theme and opens the editor. If</text><text x="1494" y="114" font-size="11.5" fill="#CBC9D6">the text reads as a description rather than</text><text x="1494" y="132" font-size="11.5" fill="#CBC9D6">a title, it becomes Ada's first chat message</text><text x="1494" y="150" font-size="11.5" fill="#CBC9D6">and she drafts the slides.</text><circle cx="1480" cy="172" r="8" fill="#F2A97E"/><text x="1480" y="176" font-size="10" font-weight="700" fill="#1A1206" text-anchor="middle">2</text><text x="1494" y="176" font-size="11.5" fill="#CBC9D6">The card menu is a Radix dropdown and</text><text x="1494" y="194" font-size="11.5" fill="#CBC9D6">keyboard reachable: Tab to the card, then ⋯</text><text x="1494" y="212" font-size="11.5" fill="#CBC9D6">or Shift+F10. Rename edits the card title</text><text x="1494" y="230" font-size="11.5" fill="#CBC9D6">inline. Duplicate makes “Copy of …” with new</text><text x="1494" y="248" font-size="11.5" fill="#CBC9D6">IDs and shared images. Delete… asks for</text><text x="1494" y="266" font-size="11.5" fill="#CBC9D6">confirmation and names the deck.</text><circle cx="1480" cy="288" r="8" fill="#F2A97E"/><text x="1480" y="292" font-size="10" font-weight="700" fill="#1A1206" text-anchor="middle">3</text><text x="1494" y="292" font-size="11.5" fill="#CBC9D6">Focus ring: 2px accent plus a 2px accent</text><text x="1494" y="310" font-size="11.5" fill="#CBC9D6">halo at 35%. Arrow keys move between cards;</text><text x="1494" y="328" font-size="11.5" fill="#CBC9D6">Enter opens a deck.</text><circle cx="1480" cy="350" r="8" fill="#F2A97E"/><text x="1480" y="354" font-size="10" font-weight="700" fill="#1A1206" text-anchor="middle">4</text><text x="1494" y="354" font-size="11.5" fill="#CBC9D6">Narrow (&lt;800px): the sidebar stacks above,</text><text x="1494" y="372" font-size="11.5" fill="#CBC9D6">the grid becomes one column, and the theme</text><text x="1494" y="390" font-size="11.5" fill="#CBC9D6">picker moves under the title field.</text></svg>