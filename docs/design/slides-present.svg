<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-label="Slides: presenting full screen with keyboard navigation and exit"><title>Slides: presenting full screen with keyboard navigation and exit</title><rect width="1800" height="900" fill="#07060B"/><defs><clipPath id="screen"><rect width="1440" height="900"/></clipPath><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F5A9F"/><stop offset="1" stop-color="#559FA0"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/></filter></defs><g clip-path="url(#screen)"><rect width="1440" height="900" fill="#0C0B12"/><rect width="1440" height="900" fill="#000000"/><g transform="translate(0,45) scale(0.75)"><rect width="1920" height="1080" fill="#FFFFFF"/><text x="136" y="200" font-family="Arial" font-size="80" font-weight="700" fill="#111418">What changed this quarter</text><text x="136" y="340" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="340" font-family="Arial" font-size="48" fill="#1F2328">Revenue grew 18% against a plan of 12%, driven by…</text><text x="196" y="400" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="256" y="400" font-family="Arial" font-size="40" fill="#1F2328">Churn held steady; expansion did the work.</text><text x="136" y="460" font-family="Arial" font-size="48" fill="#1F2328">•</text><text x="196" y="460" font-family="Arial" font-size="48" fill="#1F2328">This is a deliberately long bullet so the shared</text><text x="196" y="518" font-family="Arial" font-size="48" fill="#1F2328">layout has to wrap it across more than one line</text><text x="136" y="640" font-family="Arial" font-size="48" fill="#1F2328">1.</text><text x="196" y="640" font-family="Arial" font-size="48" fill="#1F2328">Underlined and coloured runs survive export.</text></g><rect x="0" y="45" width="1440" height="810" rx="4" fill="none" stroke="#24222F"/><g filter="url(#sh)"><rect x="550" y="836" width="340" height="44" rx="12" fill="#1B1A27" fill-opacity="0.92" stroke="#2A2A31"/></g><rect x="558" y="843" width="30" height="30" rx="7" fill="none"/><text x="573" y="863" font-size="18" font-weight="600" fill="#EEEDF3" text-anchor="middle">‹</text><text x="632" y="863" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#EEEDF3" text-anchor="middle">2 / 5</text><rect x="662" y="843" width="30" height="30" rx="7" fill="none"/><text x="677" y="863" font-size="18" font-weight="600" fill="#EEEDF3" text-anchor="middle">›</text><line x1="702" y1="846" x2="702" y2="870" stroke="#2E2B3B"/><text x="718" y="863" font-size="13" font-weight="600" fill="#A4A1B3">?</text><rect x="794" y="843" width="88" height="30" rx="7" fill="#1E1E24" stroke="#3A3A44"/><text x="806" y="863" font-size="13" font-weight="500" fill="#EEEDF3">Exit</text><text x="870" y="863" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#8C899C" text-anchor="end">esc</text><rect x="791" y="840" width="94" height="36" rx="9" fill="none" stroke="#9B8CFF" stroke-width="2"/><g filter="url(#sh)"><rect x="1100" y="40" width="300" height="236" rx="14" fill="#1B1A27" stroke="#2A2A31"/></g><text x="1118" y="70" font-size="14" font-weight="600" fill="#EEEDF3">Keyboard</text><text x="1118" y="100" font-family="JetBrains Mono, monospace" font-size="12" fill="#CBC9D6">→ ↓ Space PgDn</text><text x="1382" y="100" font-size="12.5" fill="#A4A1B3" text-anchor="end">Next slide</text><text x="1118" y="124" font-family="JetBrains Mono, monospace" font-size="12" fill="#CBC9D6">← ↑ PgUp</text><text x="1382" y="124" font-size="12.5" fill="#A4A1B3" text-anchor="end">Previous slide</text><text x="1118" y="148" font-family="JetBrains Mono, monospace" font-size="12" fill="#CBC9D6">Home / End</text><text x="1382" y="148" font-size="12.5" fill="#A4A1B3" text-anchor="end">First / last</text><text x="1118" y="172" font-family="JetBrains Mono, monospace" font-size="12" fill="#CBC9D6">3 then Enter</text><text x="1382" y="172" font-size="12.5" fill="#A4A1B3" text-anchor="end">Go to slide 3</text><text x="1118" y="196" font-family="JetBrains Mono, monospace" font-size="12" fill="#CBC9D6">F</text><text x="1382" y="196" font-size="12.5" fill="#A4A1B3" text-anchor="end">Toggle fullscreen</text><text x="1118" y="220" font-family="JetBrains Mono, monospace" font-size="12" fill="#CBC9D6">Esc</text><text x="1382" y="220" font-size="12.5" fill="#A4A1B3" text-anchor="end">Exit to the editor</text><text x="1118" y="244" font-family="JetBrains Mono, monospace" font-size="12" fill="#CBC9D6">?</text><text x="1382" y="244" font-size="12.5" fill="#A4A1B3" text-anchor="end">Show or hide this</text></g><rect x="1460" y="20" width="320" height="532" rx="10" fill="#1A1520" stroke="#F2A97E" stroke-opacity="0.35"/><text x="1472" y="38" font-size="11.5" font-weight="600" fill="#F2A97E">Design notes · presentation</text><circle cx="1480" cy="56" r="8" fill="#F2A97E"/><text x="1480" y="60" font-size="10" font-weight="700" fill="#1A1206" text-anchor="middle">1</text><text x="1494" y="60" font-size="11.5" fill="#CBC9D6">Present starts from the selected slide (⌘↵,</text><text x="1494" y="78" font-size="11.5" fill="#CBC9D6">or ⇧⌘↵ from the start). It saves pending</text><text x="1494" y="96" font-size="11.5" fill="#CBC9D6">edits, then asks for fullscreen. If the</text><text x="1494" y="114" font-size="11.5" fill="#CBC9D6">browser refuses, it fills the window and a</text><text x="1494" y="132" font-size="11.5" fill="#CBC9D6">toast says “Press F for fullscreen”.</text><circle cx="1480" cy="154" r="8" fill="#F2A97E"/><text x="1480" y="158" font-size="10" font-weight="700" fill="#1A1206" text-anchor="middle">2</text><text x="1494" y="158" font-size="11.5" fill="#CBC9D6">The slide is the same SVG renderer as the</text><text x="1494" y="176" font-size="11.5" fill="#CBC9D6">editor, letterboxed on black and scaled to</text><text x="1494" y="194" font-size="11.5" fill="#CBC9D6">the viewport. Hidden slides are skipped.</text><text x="1494" y="212" font-size="11.5" fill="#CBC9D6">There are no transitions; slides change</text><text x="1494" y="230" font-size="11.5" fill="#CBC9D6">instantly, which also covers</text><text x="1494" y="248" font-size="11.5" fill="#CBC9D6">prefers-reduced-motion.</text><circle cx="1480" cy="270" r="8" fill="#F2A97E"/><text x="1480" y="274" font-size="10" font-weight="700" fill="#1A1206" text-anchor="middle">3</text><text x="1494" y="274" font-size="11.5" fill="#CBC9D6">The control bar appears on mouse move or Tab</text><text x="1494" y="292" font-size="11.5" fill="#CBC9D6">and hides after 2s idle. It never hides</text><text x="1494" y="310" font-size="11.5" fill="#CBC9D6">while it has focus. Exit is always reachable</text><text x="1494" y="328" font-size="11.5" fill="#CBC9D6">with Esc or the visible Exit button, and</text><text x="1494" y="346" font-size="11.5" fill="#CBC9D6">focus returns to the slide you were on in</text><text x="1494" y="364" font-size="11.5" fill="#CBC9D6">the editor.</text><circle cx="1480" cy="386" r="8" fill="#F2A97E"/><text x="1480" y="390" font-size="10" font-weight="700" fill="#1A1206" text-anchor="middle">4</text><text x="1494" y="390" font-size="11.5" fill="#CBC9D6">Accessibility: each slide is role=img with</text><text x="1494" y="408" font-size="11.5" fill="#CBC9D6">an aria-label made from its text and image</text><text x="1494" y="426" font-size="11.5" fill="#CBC9D6">alt text. A polite live region announces</text><text x="1494" y="444" font-size="11.5" fill="#CBC9D6">“Slide 2 of 5: What changed this quarter”.</text><circle cx="1480" cy="466" r="8" fill="#F2A97E"/><text x="1480" y="470" font-size="10" font-weight="700" fill="#1A1206" text-anchor="middle">5</text><text x="1494" y="470" font-size="11.5" fill="#CBC9D6">Narrow or touch screens: swipe left and</text><text x="1494" y="488" font-size="11.5" fill="#CBC9D6">right, tap the right or left third to go</text><text x="1494" y="506" font-size="11.5" fill="#CBC9D6">next or previous, and the control bar stays</text><text x="1494" y="524" font-size="11.5" fill="#CBC9D6">visible. A presenter view with notes is</text><text x="1494" y="542" font-size="11.5" fill="#CBC9D6">deferred.</text></svg>