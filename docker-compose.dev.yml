# Infra only, for hot-reload development: `make dev`
# Ports are published on localhost so the API and Next run on the host.
name: lazyagents-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lazyagents
      POSTGRES_PASSWORD: lazyagents
      POSTGRES_DB: lazyagents
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazyagents -d lazyagents"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    # Each bucket grows 7 volumes up front. The defaults (30 GB volumes, a low
    # volume cap) run out after one bucket, so use 1 GB volumes and allow 100.
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=100 -ip=127.0.0.1 -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # The hardened runner for `make start` / `make runner`. It runs here rather
  # than on the host so compose owns its lifecycle: a new start replaces the
  # old one instead of leaving a stray runner claiming runs with stale code.
  # Turn containers join the agents network, which has nothing else on it,
  # and reach the API on the host. The runner joins it only so compose
  # creates it; the runner listens on no port.
  # The socket mount is root-equivalent on the host, as in the full stack.
  runner:
    profiles: ["runner"]
    image: golang:1.26-alpine
    working_dir: /src/server
    command: ["go", "run", "./cmd/vesper", "runner"]
    user: "0"
    environment:
      CGO_ENABLED: "0"
      DATABASE_URL: postgres://lazyagents:lazyagents@postgres:5432/lazyagents?sslmode=disable
      S3_ENDPOINT: http://seaweedfs:8333
      SECRETS_KEY: ${SECRETS_KEY:-}
      RUNNER_BACKEND: docker
      RUNNER_STACK: lazyagents-dev
      RUNNER_NETWORK: lazyagents-dev_agents
      RUNNER_MCP_URL: http://host.docker.internal:${API_PORT:-8000}/mcp
      RUNNER_IMAGE: ${RUNNER_IMAGE:-vesper/agent-base:latest}
      RUNNER_MAX_CONCURRENT: ${RUNNER_MAX_CONCURRENT:-4}
      ROLLOVER_CONTEXT_TOKENS: ${ROLLOVER_CONTEXT_TOKENS:-0}
      RUNNER_REPO_MAP: ${RUNNER_REPO_MAP:-false}
      # Each turn's sandboxed Docker API socket; turns mount the volume read-only.
      RUNNER_DOCKER_PROXY_DIR: /run/lazyagents-docker
      RUNNER_DOCKER_PROXY_VOLUME: lazyagents-dev-docker-proxy
      # The volume (created on first use) holding the Nix store turns share
      # through this runner's nix-daemon. One daemon per store: the stacks
      # must not share it.
      RUNNER_NIX_VOLUME: lazyagents-dev-nix
      # Chats' playgrounds, one per port, on Vesper's host. WEB_URL is the page
      # that may read them across origins (the API and Logs tabs).
      RUNNER_PLAYGROUND_PORTS: ${PLAYGROUND_PORTS:-8090-8094}
      WEB_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "127.0.0.1:${PLAYGROUND_PORTS:-8090-8094}:${PLAYGROUND_PORTS:-8090-8094}"
    networks: [default, agents]
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./server:/src/server:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-proxy:/run/lazyagents-docker
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

networks:
  agents:
    # Fixed name: the runner passes it to Docker as RUNNER_NETWORK.
    name: lazyagents-dev_agents

volumes:
  pgdata:
  seaweed:
  go-mod:
  go-build:
  docker-proxy:
    # Fixed name: the runner mounts it into turns as RUNNER_DOCKER_PROXY_VOLUME.
    name: lazyagents-dev-docker-proxy
